name: Fix app-final syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-final-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair inline handler syntax
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app-final.html')
          s = p.read_text()
          replacement = '''function editPO(id,status){window.__editPOId=id;modal('Edit PO','<div class="form"><label>Status<select id="p1">'+['DRAFT','PENDING','APPROVED','REJECTED','SENT','PARTIAL','CLOSED','CANCELLED'].map(s=>'<option '+(s===status?'selected':'')+'>'+s+'</option>').join('')+'</select></label></div><div class="right"><button class="btn primary" onclick="savePOEdit()">Save</button></div>')}async function savePOEdit(){await save('/api/po/'+window.__editPOId,{status:$("p1").value});closeM();refresh()}function newVendor'''
          s, n = re.subn(r'function editPO\(id,status\)\{.*?\}function newVendor', replacement, s, count=1, flags=re.S)
          print(f'editPO replacements: {n}')
          if n != 1:
            raise SystemExit('Targeted editPO syntax repair was not found; refusing to modify production file.')
          p.write_text(s)
      - name: Validate JavaScript before commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('app-final.html').read_text()
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, re.S)
          Path('/tmp/app-final.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app-final.js
      - name: Commit only validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-final.html
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m 'fix: repair app-final javascript syntax'
          git push
