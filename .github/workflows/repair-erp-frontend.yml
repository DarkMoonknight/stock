name: Repair and validate ERP frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair embedded handler quoting
        shell: python
        run: |
          from pathlib import Path
          p = Path('app-final.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "status:$(\'e1\').value": "status:$(\\'e1\\').value",
              "notes:$(\'e2\').value": "notes:$(\\'e2\\').value",
              "status:$(\'p1\').value": "status:$(\\'p1\\').value",
              "vendorId:$(\'i1\').value": "vendorId:$(\\'i1\\').value",
              "number:$(\'i2\').value": "number:$(\\'i2\\').value",
              "amount:num($(\'i3\').value)": "amount:num($(\\'i3\\').value)",
              "invoiceDate:$(\'i4\').value": "invoiceDate:$(\\'i4\\').value",
              "dueDate:$(\'i5\').value": "dueDate:$(\\'i5\\').value",
              "status:$(\'i6\').value": "status:$(\\'i6\\').value",
              "vendorId:$(\'y1\').value||undefined": "vendorId:$(\\'y1\\').value||undefined",
              "invoiceId:$(\'y2\').value||undefined": "invoiceId:$(\\'y2\\').value||undefined",
              "amount:num($(\'y3\').value)": "amount:num($(\\'y3\\').value)",
              "method:$(\'y4\').value": "method:$(\\'y4\\').value",
              "reference:$(\'y5\').value": "reference:$(\\'y5\\').value",
              "category:$(\'z1\').value": "category:$(\\'z1\\').value",
              "description:$(\'z2\').value": "description:$(\\'z2\\').value",
              "amount:num($(\'z3\').value)": "amount:num($(\\'z3\\').value)",
              "expenseDate:$(\'z4\').value": "expenseDate:$(\\'z4\\').value",
              "password:$(\'rp\').value": "password:$(\\'rp\\').value",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app-final.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No JavaScript found')
          Path('/tmp/app-final.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app-final.js
          echo 'app-final JavaScript syntax: PASS'

      - name: Commit repaired frontend
        shell: bash
        run: |
          if git diff --quiet -- app-final.html; then
            echo 'No frontend repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-final.html
          git commit -m 'fix: repair embedded ERP handler quoting'
          git push
