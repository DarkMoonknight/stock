name: Repair and validate ERP frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erp-frontend-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair embedded inline handler quoting
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app-final.html')
          s = p.read_text(encoding='utf-8')

          # The HTML is generated inside JavaScript strings. Repair only the
          # onclick=\"...\" fragments and only quotes that are not already
          # escaped, so the transformation is safe to run repeatedly.
          pattern = re.compile(r'onclick=\\"((?:[^"\\]|\\.)*)\\"')

          def fix(match):
              inner = match.group(1)
              inner = re.sub(r"(?<!\\)'", r"\\'", inner)
              return 'onclick=\\"' + inner + '\\"'

          repaired, count = pattern.subn(fix, s)
          print(f'inline onclick handlers repaired: {count}')
          p.write_text(repaired, encoding='utf-8')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app-final.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No JavaScript found')
          Path('/tmp/app-final.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app-final.js
          echo 'app-final JavaScript syntax: PASS'

      - name: Commit repaired frontend
        shell: bash
        run: |
          if git diff --quiet -- app-final.html; then
            echo 'No frontend repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-final.html
          git commit -m 'fix: repair inline ERP frontend handlers'
          git push
