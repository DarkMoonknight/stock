name: Repair and validate ERP frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: erp-frontend-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair nested DOM selectors inside generated handlers
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app-final.html')
          s = p.read_text(encoding='utf-8')
          script_re = re.compile(r'(<script[^>]*>)(.*?)(</script>)', re.S)
          onclick_re = re.compile(r'onclick="([^"]*)"')
          selector_re = re.compile(r"\$\('([A-Za-z0-9_-]+)'\)")

          def repair_script(m):
              body = m.group(2)
              def repair_onclick(h):
                  handler = h.group(1)
                  repaired = selector_re.sub(lambda q: "$(\\'" + q.group(1) + "\\')", handler)
                  return 'onclick="' + repaired + '"'
              return m.group(1) + onclick_re.sub(repair_onclick, body) + m.group(3)

          repaired, scripts = script_re.subn(repair_script, s)
          print(f'script blocks processed: {scripts}')
          p.write_text(repaired, encoding='utf-8')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app-final.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No JavaScript found')
          Path('/tmp/app-final.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app-final.js
          echo 'app-final JavaScript syntax: PASS'

      - name: Commit repaired frontend
        shell: bash
        run: |
          if git diff --quiet -- app-final.html; then
            echo 'No frontend repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-final.html
          git commit -m 'fix: repair generated ERP handlers'
          git push
