name: Repair and validate ERP frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair embedded inline handler quoting
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app-final.html')
          s = p.read_text(encoding='utf-8')
          def fix(m):
              return 'onclick="' + m.group(1).replace("'", "\\'") + '"'
          s2, n = re.subn(r'onclick="([^"]*)"', fix, s)
          print(f'inline onclick handlers normalized: {n}')
          p.write_text(s2, encoding='utf-8')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app-final.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No JavaScript found')
          Path('/tmp/app-final.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app-final.js
          echo 'app-final JavaScript syntax: PASS'

      - name: Commit repaired frontend
        shell: bash
        run: |
          if git diff --quiet -- app-final.html; then
            echo 'No frontend repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-final.html
          git commit -m 'fix: repair inline ERP frontend handlers'
          git push
