name: Advanced Validation
on:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: node --check src/advanced-server.js
      - name: Validate frontend script
        run: node -e "const fs=require('fs'); for(const f of ['../app-final.html']){const s=fs.readFileSync(f,'utf8'); const m=s.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw new Error('No script in '+f); new Function(m[1]);} console.log('frontend script syntax OK')"
