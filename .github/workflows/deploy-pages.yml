name: Deploy EzyProcure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair inline handler quoting before validation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app-final.html')
          s = p.read_text(encoding='utf-8')

          # app-final.html contains HTML snippets inside JavaScript strings.
          # Those snippets use onclick=\"...\". Any single quote inside the
          # handler must be escaped for the surrounding JavaScript string.
          pattern = re.compile(r'onclick=\\"((?:[^"\\]|\\.)*)\\"')

          def fix(match):
              inner = match.group(1)
              inner = re.sub(r"(?<!\\)'", r"\\'", inner)
              return 'onclick=\\"' + inner + '\\"'

          repaired, count = pattern.subn(fix, s)
          print(f'inline onclick handlers repaired: {count}')
          p.write_text(repaired, encoding='utf-8')

      - name: Validate Pages payload
        run: |
          test -f CNAME
          test -f app.html
          test -f app-final.html
          test -f approvals.html
          test -f login.html
          test "$(cat CNAME)" = "vaquitecalifornia.com"
          echo "Pages domain: $(cat CNAME)"

      - name: Validate enterprise frontend JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('app-final.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No JavaScript found in app-final.html')
          Path('/tmp/app-final.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app-final.js
          echo "app-final JavaScript syntax: PASS"

      - name: Validate login and approval payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['login.html','approvals.html']:
              s = Path(name).read_text(encoding='utf-8')
              if '<script' not in s:
                  raise SystemExit(f'No script block found in {name}')
          PY
          echo "Login/approval payload validation: PASS"

      - name: Prepare login-first site
        run: cp app.html index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
