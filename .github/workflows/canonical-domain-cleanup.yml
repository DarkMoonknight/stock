name: Canonical Domain Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-domain-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Replace stale domain references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('backend/src/server.js'), Path('backend/.env.example')]
          replacements = {
              'https://procurement.vaqutecalifornia.com': 'https://vaquitecalifornia.com',
              'https://vaqutecalifornia.com': 'https://vaquitecalifornia.com',
              'https://www.vaqutecalifornia.com': 'https://www.vaquitecalifornia.com',
          }
          for path in files:
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
          PY
      - name: Validate canonical domain references
        run: |
          ! grep -RInE 'vaqutecalifornia|procurement\.vaquitecalifornia' backend/src backend/.env.example
          node --check backend/src/server.js
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/src/server.js backend/.env.example
          if git diff --cached --quiet; then
            echo 'No stale domain references found.'
          else
            git commit -m 'fix: remove stale domain references'
            git push
          fi
