services:
  - type: web
    name: ezyprocure-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && npm run seed && node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ezyprocure-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: FRONTEND_URL
        value: https://procurement.vaqutecalifornia.com
      - key: DEMO_ADMIN_EMAIL
        value: admin@ezyprocure.local
      - key: DEMO_ADMIN_PASSWORD
        sync: false

databases:
  - name: ezyprocure-db
    databaseName: ezyprocure
    user: ezyprocure
