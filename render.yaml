services:
  - type: web
    name: ezyprocure-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && npm run seed && node src/advanced-server.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ezyprocure-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: FRONTEND_URL
        value: https://vaqutecalifornia.com
      - key: DEMO_ADMIN_EMAIL
        value: admin@ezyprocure.local
      - key: DEMO_ADMIN_PASSWORD
        value: EzyProcure@2026!
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: ezyprocure-db
    plan: free
