<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>EzyProcure Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font:15px system-ui;color:#172033}.box{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 18px 50px #10203918}.logo{font-size:26px;font-weight:800}.logo i{color:#079b69;font-style:normal}.muted{color:#718096;margin:7px 0 22px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e1eb;border-radius:9px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#079b69;color:#fff;font-weight:700;cursor:pointer}.err{color:#c53030;margin-top:12px;min-height:18px}.status{margin-top:14px;font-size:12px;color:#718096}.ok{color:#087a52}.bad{color:#c53030}.demo{margin-top:16px;background:#f1faf7;border-radius:10px;padding:12px;font-size:12px}</style></head><body><main class="box"><div class="logo">⬡ <i>EzyProcure</i></div><div class="muted">Enterprise Procurement & Operations ERP</div><form id="login"><label>Email</label><input id="email" type="email" autocomplete="username" value="admin@ezyprocure.local" required><label>Password</label><input id="password" type="password" autocomplete="current-password" value="EzyProcure@2026!" required><button id="signIn">Sign in</button><div id="err" class="err"></div></form><div class="demo"><b>Demo access</b><br>Email: admin@ezyprocure.local<br>Password: EzyProcure@2026!<br><small>Change the password from Settings after login.</small></div><div id="status" class="status">API: checking…</div></main><script>const API='https://ezyprocure-api.onrender.com',status=document.getElementById('status'),err=document.getElementById('err'),signIn=document.getElementById('signIn');async function check(){try{let r=await fetch(API+'/api/health',{cache:'no-store'}),d=await r.json();status.textContent=d.database==='connected'?'API: Online · Database connected':'API: Online · Database unavailable';status.className='status '+(d.database==='connected'?'ok':'bad')}catch(e){status.textContent='API: Offline · '+e.message;status.className='status bad'}}check();document.getElementById('login').onsubmit=async e=>{e.preventDefault();err.textContent='';signIn.disabled=true;signIn.textContent='Signing in…';try{let r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');localStorage.setItem('ezyprocure_token',d.token);localStorage.setItem('ezyprocure_user',JSON.stringify(d.user));location.href='./app-final.html?v=3.0.0'}catch(x){err.textContent=x.message}finally{signIn.disabled=false;signIn.textContent='Sign in'}};</script></body></html>
