<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>EzyProcure Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font:15px system-ui;color:#172033}.box{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:28px;box-shadow:0 18px 50px #10203918}.logo{font-size:25px;font-weight:800;margin-bottom:8px}.logo i{color:#079b69;font-style:normal}.muted{color:#718096;margin-bottom:22px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dbe2eb;border-radius:9px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#079b69;color:#fff;font-weight:700;cursor:pointer}.demo{margin-top:16px;background:#f1faf7;border-radius:10px;padding:12px;font-size:12px}.err{color:#c53030;margin-top:12px;min-height:18px;white-space:pre-wrap}.status{margin-top:12px;font-size:12px;color:#718096}.ok{color:#087a52}.bad{color:#c53030}</style></head><body><main class="box"><div class="logo">⬡ <i>EzyProcure</i></div><div class="muted">Procurement ERP · Secure Login</div><form id="login"><label>Email</label><input id="email" type="email" autocomplete="username" value="admin@ezyprocure.local" required><label>Password</label><input id="password" type="password" autocomplete="current-password" value="EzyProcure@2026!" required><button id="signIn">Sign in</button><div id="err" class="err"></div></form><div class="demo"><b>Demo access</b><br>Email: admin@ezyprocure.local<br>Password: EzyProcure@2026!<br><small>Change this password before real production use.</small></div><div id="status" class="status">API: checking…</div></main><script>
const API='https://ezyprocure-api.onrender.com';
const status=document.getElementById('status');
const err=document.getElementById('err');
const signIn=document.getElementById('signIn');
async function checkApi(){
  status.textContent='API: checking…'; status.className='status';
  try{
    const r=await fetch(API+'/api/health',{method:'GET',mode:'cors',cache:'no-store'});
    const d=await r.json();
    if(!r.ok) throw new Error('HTTP '+r.status);
    if(d.database==='connected'){status.textContent='API: Online · Database connected';status.className='status ok';}
    else {status.textContent='API: Online · Database unavailable';status.className='status bad';}
  }catch(e){status.textContent='API: Offline · '+(e.message||'Connection failed');status.className='status bad';}
}
checkApi();
document.getElementById('login').addEventListener('submit',async e=>{
  e.preventDefault(); err.textContent=''; signIn.disabled=true; signIn.textContent='Signing in…';
  try{
    const r=await fetch(API+'/api/auth/login',{method:'POST',mode:'cors',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({email:email.value.trim(),password:password.value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||`Login failed (HTTP ${r.status})`);
    if(!d.token) throw new Error('Login response did not contain a token');
    localStorage.setItem('ezyprocure_token',d.token);
    localStorage.setItem('ezyprocure_user',JSON.stringify(d.user));
    location.href='./app.html?v=20260820';
  }catch(x){err.textContent=x.message||'Unable to connect to API';}
  finally{signIn.disabled=false;signIn.textContent='Sign in';}
});
</script></body></html>
