<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>EzyProcure Enterprise 3</title>
<style>
:root{--nav:#071b33;--brand:#079b69;--bg:#f4f7fb;--card:#fff;--line:#e1e7ef;--ink:#172033;--muted:#718096;--danger:#c53030;--warn:#a66b00}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.layout{display:flex;min-height:100vh}.side{width:255px;background:var(--nav);color:#d9e4ef;position:fixed;inset:0 auto 0 0;padding:18px 13px;overflow:auto}.brand{font-size:22px;font-weight:800;padding:6px 10px 18px}.brand span{color:#19cf8a}.user{background:#0d2946;border:1px solid #23415e;border-radius:12px;padding:12px;margin:0 4px 14px}.user b{display:block;color:#fff}.user small{color:#9bb0c4}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#c7d5e4;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--brand);color:#fff}.main{margin-left:255px;width:calc(100% - 255px);padding:20px}.top{display:flex;gap:10px;align-items:center;margin-bottom:18px}.search{flex:1;padding:11px 13px;border:1px solid var(--line);background:#fff;border-radius:10px}.btn{border:1px solid #d4dde8;background:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}.btn:hover{filter:brightness(.98)}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.danger{background:#fff4f4;border-color:#ffd1d1;color:var(--danger)}.title{font-size:27px;font-weight:800}.sub{color:var(--muted);margin-top:4px}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 5px 18px #13243a0a}.metric{font-size:24px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left;white-space:nowrap}th{font-size:12px;color:#637083}td.actions{white-space:nowrap}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef9f4;color:#087a52;font-size:11px}.tag.warn{background:#fff6df;color:var(--warn)}.tag.bad{background:#fff0f0;color:var(--danger)}.empty{padding:25px;text-align:center;color:var(--muted)}.error{padding:12px;background:#fff5f5;border:1px solid #ffd0d0;color:var(--danger);border-radius:10px;margin-top:10px}.ok{padding:12px;background:#f1fff9;border:1px solid #bcebd9;color:#087a52;border-radius:10px;margin-top:10px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form label{font-size:12px;font-weight:700;color:#556276}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #d9e1eb;border-radius:8px;background:#fff;margin-top:5px}.span3{grid-column:span 3}.modal{position:fixed;inset:0;background:#071b3380;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.on{display:flex}.modalbox{width:min(850px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}.notice{font-size:12px;color:var(--muted);margin:10px 0}.right{text-align:right}.section{margin-top:18px}.danger-text{color:var(--danger)}@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}}@media(max-width:760px){.side{width:70px;padding:12px 8px}.brand{font-size:0}.brand span{font-size:18px}.user{display:none}.nav button{font-size:0;text-align:center;padding:12px}.nav button::first-letter{font-size:18px}.main{margin-left:70px;width:calc(100% - 70px);padding:12px}.top{flex-wrap:wrap}.search{flex-basis:100%}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.span3{grid-column:span 1}}
</style></head>
<body><div class="layout"><aside class="side"><div class="brand">⬡ <span>EzyProcure</span></div><div class="user" id="userBox">Loading…</div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><input id="search" class="search" placeholder="Search current module…"><button class="btn" onclick="reloadCurrent()">↻ Refresh</button><button class="btn" onclick="openSettings('profile')">⚙ Settings</button><button class="btn" onclick="logout()">Sign out</button></div><section id="dashboard" class="page"></section><section id="procurement" class="page"></section><section id="site" class="page"></section><section id="hr" class="page"></section><section id="accounts" class="page"></section><section id="reports" class="page"></section><section id="settings" class="page"></section><section id="users" class="page"></section><section id="audit" class="page"></section></main></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
const API='https://ezyprocure-api.onrender.com';const token=localStorage.getItem('ezyprocure_token');let me=null,perms=[];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=x=>Number(x||0);const money=x=>'₹'+n(x).toLocaleString('en-IN',{maximumFractionDigits:2});
async function api(path,opt={}){let r;try{r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})},cache:'no-store'})}catch(e){throw new Error('Backend unavailable. Check Render/API deployment.')}const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(r.status===401){logout();throw new Error('Session expired')}if(!r.ok)throw new Error(d.error||`API ${r.status}`);return d}
function logout(){localStorage.clear();location.href='./login.html'}function can(x){return perms.includes('*')||perms.includes(x)}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));load(id)}
const loaded={};async function load(id,force=false){if(loaded[id]&&!force)return;loaded[id]=true;try{if(id==='dashboard')await dashboard();if(id==='procurement')await procurement();if(id==='site')await site();if(id==='hr')await hr();if(id==='accounts')await accounts();if(id==='reports')await reports();if(id==='settings')await settings();if(id==='users')await users();if(id==='audit')await audit()}catch(e){loaded[id]=false;$(id).innerHTML=`<div class="title">${esc(id)}</div><div class="error">${esc(e.message)}<br><br><button class="btn primary" onclick="load('${id}',true)">Retry</button></div>`}}
function reloadCurrent(){const id=document.querySelector('.page.active')?.id||'dashboard';loaded[id]=false;load(id,true)}
function card(a,b,c=''){return`<div class="card"><div>${a}</div><div class="metric">${b}</div><div class="sub">${c}</div></div>`}
function buildNav(){const items=[['dashboard','▣ Dashboard',true],['procurement','▤ Procurement',can('procurement')||can('pr')],['site','⌂ Site Operations',can('site')||can('sites')],['hr','♙ HR & Labour',can('hr')],['accounts','₹ Accounts & Finance',can('accounts')],['reports','▥ Reports & Generate',can('reports')],['settings','⚙ Settings',can('settings')||me.role==='ADMIN'],['users','♙ User Management',me.role==='ADMIN'||me.role==='MANAGEMENT'],['audit','◷ Audit & Control',me.role==='ADMIN'||me.role==='MANAGEMENT']];$('nav').innerHTML=items.filter(x=>x[2]).map(x=>`<button data-page="${x[0]}" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
async function dashboard(){const d=await api('/api/dashboard');$('dashboard').innerHTML=`<div class="title">Enterprise Command Center</div><div class="sub">Full operational control — editable masters, approvals, finance, workforce and reporting.</div><div class="cards">${card('Pending PR',d.pendingPR,'Purchase requests')}${card('Open RFQ',d.pendingRFQ,'Supplier sourcing')}${card('Open PO',d.openPO,'Commitments')}${card('GRN Queue',d.openGRN,'Receipts')}${card('MRN Queue',d.pendingMRN,'Material requests')}${card('Invoices',d.pendingInvoices,'Accounts payable')}${card('Vendors',d.activeVendors,'Active suppliers')}${card('Employees',d.employees,'Active staff')}${card('Labour',d.activeLabour,'Workforce')}${card('Open Tasks',d.openTasks,'Site execution')}${card('Expenses',money(d.totalExpenses),'Recorded spend')}</div><div class="grid"><div class="panel"><div class="toolbar"><b>Quick actions</b></div><div class="tabs">${can('procurement')?'<button class="btn primary" onclick="show(\'procurement\');openPR()">+ New PR</button>':''}${can('site')?'<button class="btn" onclick="show(\'site\');openMRN()">+ New MRN</button>':''}${can('accounts')?'<button class="btn" onclick="show(\'accounts\');openInvoice()">+ Invoice</button>':''}${can('hr')?'<button class="btn" onclick="show(\'hr\');openEmployee()">+ Employee</button>':''}</div></div><div class="panel"><b>Account</b><p class="notice">${esc(me.name)} · ${esc(me.role)} · ${esc(me.department||'Owner / Administration')}</p><button class="btn" onclick="openSettings('profile')">Edit profile</button> <button class="btn" onclick="openSettings('password')">Change password</button></div></div>`}
async function procurement(){const [sites,materials,prs,rfqs,pos,vendors]=await Promise.all([api('/api/sites'),api('/api/materials'),api('/api/pr'),api('/api/rfq'),api('/api/po'),api('/api/vendors')]);$('procurement').innerHTML=`<div class="toolbar"><div><div class="title">Procurement Control</div><div class="sub">PR → RFQ → Quote → PO with editable records.</div></div><div>${can('procurement')?'<button class="btn primary" onclick="openPR()">+ New PR</button> <button class="btn" onclick="openRFQ()">+ RFQ</button> <button class="btn" onclick="openPO()">+ PO</button>':''}</div></div><div class="grid"><div class="panel"><div class="toolbar"><b>Purchase Requisitions</b></div><div class="table"><table><tr><th>PR</th><th>Site</th><th>Status</th><th>Required</th><th>Action</th></tr>${prs.map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.site?.name)}</td><td><span class="tag">${esc(x.status)}</span></td><td>${new Date(x.requiredDate).toLocaleDateString()}</td><td class="actions">${can('procurement')?`<button class="btn" onclick='editPR(${JSON.stringify(x)})'>Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No PR records</td></tr>'}</table></div></div><div class="panel"><div class="toolbar"><b>RFQs / POs</b></div><div class="table"><table><tr><th>Reference</th><th>Vendor</th><th>Status</th><th>Action</th></tr>${rfqs.slice(0,10).map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.vendors?.[0]?.vendor?.name||'—')}</td><td>${esc(x.status)}</td><td>View</td></tr>`).join('')}${pos.slice(0,10).map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.vendor?.name)}</td><td>${esc(x.status)}</td><td>${can('procurement')?`<button class="btn" onclick='editPO(${JSON.stringify(x)})'>Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No records</td></tr>'}</table></div></div></div><div class="panel section"><div class="toolbar"><b>Vendor Master</b>${can('procurement')?'<button class="btn primary" onclick="openVendor()">+ Vendor</button>':''}</div><div class="table"><table><tr><th>Name</th><th>GSTIN</th><th>Phone</th><th>Payment days</th><th>Rating</th><th>Action</th></tr>${vendors.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.gstin)}</td><td>${esc(v.phone)}</td><td>${v.paymentDays||0}</td><td>${v.rating??'—'}</td><td>${can('procurement')||can('accounts')?`<button class="btn" onclick='editVendor(${JSON.stringify(v)})'>Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No vendors</td></tr>'}</table></div></div>`}
function openModal(title,html){$('modalbox').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="btn" onclick="closeModal()">✕</button></div>${html}`;$('modal').classList.add('on')}function closeModal(){$('modal').classList.remove('on')}
async function openPR(){const [sites,mats]=await Promise.all([api('/api/sites'),api('/api/materials')]);openModal('Create Purchase Requisition',`<div class="form"><label>Site<select id="prSite">${sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Requested by<input id="prReq" value="${esc(me.name)}"></label><label>Required date<input id="prDate" type="date" value="${new Date(Date.now()+7*86400000).toISOString().slice(0,10)}"></label><label>Material<select id="prMat">${mats.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)}</option>`).join('')}</select></label><label>Quantity<input id="prQty" type="number" min=".001" value="1"></label><label>Estimated rate<input id="prRate" type="number" min="0" value="0"></label><label class="span3">Notes<textarea id="prNotes"></textarea></label></div><div class="right section"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="savePR()">Create PR</button></div>`)}
async function savePR(){try{await api('/api/pr',{method:'POST',body:JSON.stringify({siteId:$('prSite').value,requestedBy:$('prReq').value,requiredDate:$('prDate').value,notes:$('prNotes').value,items:[{materialId:$('prMat').value,quantity:n($('prQty').value),estimatedRate:n($('prRate').value)}]})});closeModal();reloadCurrent()}catch(e){alert(e.message)}}
function editPR(x){openModal('Edit Purchase Requisition',`<div class="form"><label>Status<select id="eStatus">${['DRAFT','PENDING','APPROVED','REJECTED','CANCELLED'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="span3">Notes<textarea id="eNotes">${esc(x.notes||'')}</textarea></label></div><div class="right section"><button class="btn primary" onclick="saveEdit('/api/pr/${x.id}',{status:$('eStatus').value,notes:$('eNotes').value})">Save changes</button></div>`)}
async function openRFQ(){const [prs,vs]=await Promise.all([api('/api/pr'),api('/api/vendors')]);openModal('Create RFQ',`<div class="form"><label>PR<select id="rfqPR">${prs.map(x=>`<option value="${x.id}">${esc(x.number)} — ${esc(x.site?.name)}</option>`).join('')}</select></label><label>Due date<input id="rfqDate" type="date" value="${new Date(Date.now()+7*86400000).toISOString().slice(0,10)}"></label><label>Vendor<select id="rfqVendor">${vs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div><div class="right section"><button class="btn primary" onclick="saveRFQ()">Create RFQ</button></div>`)}
async function saveRFQ(){try{await api('/api/rfq',{method:'POST',body:JSON.stringify({prId:$('rfqPR').value,dueDate:$('rfqDate').value,vendorIds:[$('rfqVendor').value]})});closeModal();reloadCurrent()}catch(e){alert(e.message)}}
async function openPO(){const [sites,vs,mats]=await Promise.all([api('/api/sites'),api('/api/vendors'),api('/api/materials')]);openModal('Create Purchase Order',`<div class="form"><label>Site<select id="poSite">${sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Vendor<select id="poVendor">${vs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Material<select id="poMat">${mats.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)}</option>`).join('')}</select></label><label>Quantity<input id="poQty" type="number" min=".001" value="1"></label><label>Rate<input id="poRate" type="number" min="0" value="0"></label><label>Tax<input id="poTax" type="number" min="0" value="0"></label></div><div class="right section"><button class="btn primary" onclick="savePO()">Create PO</button></div>`)}
async function savePO(){try{await api('/api/po',{method:'POST',body:JSON.stringify({siteId:$('poSite').value,vendorId:$('poVendor').value,items:[{materialId:$('poMat').value,orderedQty:n($('poQty').value),rate:n($('poRate').value)}],tax:n($('poTax').value)})});closeModal();reloadCurrent()}catch(e){alert(e.message)}}
function editPO(x){openModal('Edit Purchase Order',`<div class="form"><label>Status<select id="poStatus">${['DRAFT','PENDING','APPROVED','REJECTED','SENT','PARTIAL','CLOSED','CANCELLED'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="right section"><button class="btn primary" onclick="saveEdit('/api/po/${x.id}',{status:$('poStatus').value})">Save</button></div>`)}
function openVendor(v={}){openModal(v.id?'Edit Vendor':'New Vendor',`<div class="form"><label>Name<input id="vName" value="${esc(v.name||'')}"></label><label>GSTIN<input id="vGstin" value="${esc(v.gstin||'')}"></label><label>PAN<input id="vPan" value="${esc(v.pan||'')}"></label><label>Phone<input id="vPhone" value="${esc(v.phone||'')}"></label><label>Email<input id="vEmail" type="email" value="${esc(v.email||'')}"></label><label>Payment days<input id="vDays" type="number" min="0" value="${v.paymentDays||0}"></label><label>Credit limit<input id="vCredit" type="number" min="0" value="${v.creditLimit||0}"></label><label>Rating<input id="vRating" type="number" min="0" max="5" step=".1" value="${v.rating||''}"></label></div><div class="right section"><button class="btn primary" onclick='saveVendor(${JSON.stringify(v.id||null)})'>Save</button></div>`)}
function editVendor(v){openVendor(v)}async function saveVendor(id){const body={name:$('vName').value,gstin:$('vGstin').value,pan:$('vPan').value,phone:$('vPhone').value,email:$('vEmail').value,paymentDays:n($('vDays').value),creditLimit:n($('vCredit').value),rating:$('vRating').value? n($('vRating').value):undefined};await saveEdit(id?'/api/vendors/'+id:'/api/vendors',body,id?'PATCH':'POST')}
async function saveEdit(url,body,method='PATCH'){try{await api(url,{method,body:JSON.stringify(body)});closeModal();reloadCurrent()}catch(e){alert(e.message)}}

async function site(){const [sites,mrns,grns,stock,tasks,lab]=await Promise.all([api('/api/sites'),api('/api/mrn'),api('/api/grn'),api('/api/stock'),api('/api/tasks').catch(()=>[]),api('/api/labour')]);$('site').innerHTML=`<div class="toolbar"><div><div class="title">Site Operations</div><div class="sub">MRN, GRN, stock, tasks and site masters — editable.</div></div><div>${can('site')?'<button class="btn primary" onclick="openMRN()">+ MRN</button>':''}${can('sites')?'<button class="btn" onclick="openSite()">+ Site</button>':''}</div></div><div class="cards">${card('Sites',sites.length)}${card('MRNs',mrns.length)}${card('GRNs',grns.length)}${card('Stock lines',stock.length)}${card('Tasks',tasks.length)}</div><div class="grid"><div class="panel"><div class="toolbar"><b>Sites</b></div><div class="table"><table><tr><th>Code</th><th>Name</th><th>Location</th><th>Manager</th><th>Action</th></tr>${sites.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.location)}</td><td>${esc(x.manager)}</td><td>${can('sites')?`<button class="btn" onclick='openSite(${JSON.stringify(x)})'>Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No sites</td></tr>'}</table></div></div><div class="panel"><div class="toolbar"><b>MRN / GRN Queue</b></div><div class="table"><table><tr><th>Type</th><th>Reference</th><th>Site</th><th>Status</th></tr>${mrns.slice(0,8).map(x=>`<tr><td>MRN</td><td>${esc(x.number)}</td><td>${esc(x.site?.name)}</td><td>${esc(x.status)}</td></tr>`).join('')}${grns.slice(0,8).map(x=>`<tr><td>GRN</td><td>${esc(x.number)}</td><td>${esc(x.site?.name)}</td><td>${esc(x.status)}</td></tr>`).join('')}</table></div></div></div><div class="panel section"><div class="toolbar"><b>Stock</b></div><div class="table"><table><tr><th>Site</th><th>Material</th><th>Quantity</th><th>Unit</th></tr>${stock.map(x=>`<tr><td>${esc(x.site?.name)}</td><td>${esc(x.material?.name)}</td><td>${esc(x.quantity)}</td><td>${esc(x.material?.unit)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No stock</td></tr>'}</table></div></div>`}
function openSite(x={}){openModal(x.id?'Edit Site':'New Site',`<div class="form"><label>Code<input id="sCode" value="${esc(x.code||'')}"></label><label>Name<input id="sName" value="${esc(x.name||'')}"></label><label>Location<input id="sLoc" value="${esc(x.location||'')}"></label><label>Manager<input id="sMgr" value="${esc(x.manager||'')}"></label></div><div class="right section"><button class="btn primary" onclick='saveEdit(${x.id?`"/api/sites/${x.id}"`:'"/api/sites"'}, {code:$('sCode').value,name:$('sName').value,location:$('sLoc').value,manager:$('sMgr').value}, ${x.id?'"PATCH"':'"POST"'})'>Save</button></div>`)}
async function openMRN(){const [sites,mats]=await Promise.all([api('/api/sites'),api('/api/materials')]);openModal('Create Material Requisition',`<div class="form"><label>Site<select id="mSite">${sites.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>Requested by<input id="mReq" value="${esc(me.name)}"></label><label>Required date<input id="mDate" type="date" value="${new Date(Date.now()+86400000).toISOString().slice(0,10)}"></label><label>Material<select id="mMat">${mats.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)}</option>`).join('')}</select></label><label>Quantity<input id="mQty" type="number" min=".001" value="1"></label><label>Purpose<input id="mPurpose"></label></div><div class="right section"><button class="btn primary" onclick="saveMRN()">Create MRN</button></div>`)}
async function saveMRN(){try{await api('/api/mrn',{method:'POST',body:JSON.stringify({siteId:$('mSite').value,requestedBy:$('mReq').value,requiredDate:$('mDate').value,purpose:$('mPurpose').value,items:[{materialId:$('mMat').value,quantity:n($('mQty').value)}]})});closeModal();reloadCurrent()}catch(e){alert(e.message)}}

async function hr(){const [emp,lab,att]=await Promise.all([api('/api/employees'),api('/api/labour'),api('/api/employees/attendance').catch(()=>[])]);$('hr').innerHTML=`<div class="toolbar"><div><div class="title">HR & Workforce</div><div class="sub">Employee master, labour master and attendance.</div></div><div>${can('hr')?'<button class="btn primary" onclick="openEmployee()">+ Employee</button> <button class="btn" onclick="openLabour()">+ Labour</button>':''}</div></div><div class="cards">${card('Employees',emp.length)}${card('Labour',lab.length)}${card('Attendance',att.length)}</div><div class="grid"><div class="panel"><div class="toolbar"><b>Employees</b></div><div class="table"><table><tr><th>Code</th><th>Name</th><th>Designation</th><th>Department</th><th>Action</th></tr>${emp.map(x=>`<tr><td>${esc(x.employeeCode)}</td><td>${esc(x.name)}</td><td>${esc(x.designation)}</td><td>${esc(x.department?.name)}</td><td>${can('hr')?`<button class="btn" onclick='openEmployee(${JSON.stringify(x)})'>Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No employees</td></tr>'}</table></div></div><div class="panel"><div class="toolbar"><b>Labour</b></div><div class="table"><table><tr><th>Code</th><th>Name</th><th>Trade</th><th>Contractor</th><th>Action</th></tr>${lab.map(x=>`<tr><td>${esc(x.labourCode)}</td><td>${esc(x.name)}</td><td>${esc(x.trade)}</td><td>${esc(x.contractor)}</td><td>${can('hr')?`<button class="btn" onclick='openLabour(${JSON.stringify(x)})'>Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No labour</td></tr>'}</table></div></div></div>`}
async function openEmployee(x={}){const depts=await api('/api/departments');openModal(x.id?'Edit Employee':'New Employee',`<div class="form"><label>Employee code<input id="eCode" value="${esc(x.employeeCode||'')}"></label><label>Name<input id="eName" value="${esc(x.name||'')}"></label><label>Email<input id="eEmail" type="email" value="${esc(x.email||'')}"></label><label>Phone<input id="ePhone" value="${esc(x.phone||'')}"></label><label>Designation<input id="eDes" value="${esc(x.designation||'')}"></label><label>Department<select id="eDept">${depts.map(d=>`<option value="${d.id}" ${d.id===x.departmentId?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>Joining date<input id="eJoin" type="date" value="${x.joiningDate?new Date(x.joiningDate).toISOString().slice(0,10):''}"></label><label>Salary<input id="eSalary" type="number" min="0" value="${x.salary||''}"></label></div><div class="right section"><button class="btn primary" onclick='saveEmployee(${x.id?`"${x.id}"`:'null'})'>Save</button></div>`)}
async function saveEmployee(id){const body={employeeCode:$('eCode').value,name:$('eName').value,email:$('eEmail').value,phone:$('ePhone').value,designation:$('eDes').value,departmentId:$('eDept').value,joiningDate:$('eJoin').value||undefined,salary:n($('eSalary').value)};await saveEdit(id?'/api/employees/'+id:'/api/employees',body,id?'PATCH':'POST')}
function openLabour(x={}){openModal(x.id?'Edit Labour':'New Labour',`<div class="form"><label>Code<input id="lCode" value="${esc(x.labourCode||'')}"></label><label>Name<input id="lName" value="${esc(x.name||'')}"></label><label>Trade<input id="lTrade" value="${esc(x.trade||'')}"></label><label>Contractor<input id="lContractor" value="${esc(x.contractor||'')}"></label><label>Phone<input id="lPhone" value="${esc(x.phone||'')}"></label><label>Daily rate<input id="lRate" type="number" min="0" value="${x.dailyRate||''}"></label></div><div class="right section"><button class="btn primary" onclick='saveLabour(${x.id?`"${x.id}"`:'null'})'>Save</button></div>`)}
async function saveLabour(id){await saveEdit(id?'/api/labour/'+id:'/api/labour',{labourCode:$('lCode').value,name:$('lName').value,trade:$('lTrade').value,contractor:$('lContractor').value,phone:$('lPhone').value,dailyRate:n($('lRate').value)},id?'PATCH':'POST')}

async function accounts(){const [inv,pay,exp]=await Promise.all([api('/api/invoices'),api('/api/payments'),api('/api/expenses')]);$('accounts').innerHTML=`<div class="toolbar"><div><div class="title">Accounts & Finance</div><div class="sub">Invoices, payments and expenses with live status.</div></div><div>${can('accounts')?'<button class="btn primary" onclick="openInvoice()">+ Invoice</button> <button class="btn" onclick="openPayment()">+ Payment</button> <button class="btn" onclick="openExpense()">+ Expense</button>':''}</div></div><div class="cards">${card('Invoices',inv.length)}${card('Payments',pay.length)}${card('Expenses',exp.length)}</div><div class="grid"><div class="panel"><div class="toolbar"><b>Invoices</b></div><div class="table"><table><tr><th>Invoice</th><th>Vendor</th><th>Amount</th><th>Paid</th><th>Status</th><th>Action</th></tr>${inv.map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.vendor?.name)}</td><td>${money(x.amount)}</td><td>${money(x.paidAmount)}</td><td><span class="tag">${esc(x.status)}</span></td><td>${can('accounts')?`<button class="btn" onclick='editInvoice(${JSON.stringify(x)})'>Edit</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No invoices</td></tr>'}</table></div></div><div class="panel"><div class="toolbar"><b>Recent Payments / Expenses</b></div><div class="table"><table><tr><th>Type</th><th>Reference</th><th>Amount</th><th>Date</th></tr>${pay.slice(0,10).map(x=>`<tr><td>Payment</td><td>${esc(x.reference||x.method)}</td><td>${money(x.amount)}</td><td>${new Date(x.paidAt).toLocaleDateString()}</td></tr>`).join('')}${exp.slice(0,10).map(x=>`<tr><td>Expense</td><td>${esc(x.description)}</td><td>${money(x.amount)}</td><td>${new Date(x.expenseDate).toLocaleDateString()}</td></tr>`).join('')}</table></div></div></div>`}
async function openInvoice(){const vs=await api('/api/vendors');openModal('Post Vendor Invoice',`<div class="form"><label>Vendor<select id="iVendor">${vs.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select></label><label>Invoice number<input id="iNo"></label><label>Amount<input id="iAmt" type="number" min=".01"></label><label>Invoice date<input id="iDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Due date<input id="iDue" type="date"></label><label>PO ID optional<input id="iPO"></label></div><div class="right section"><button class="btn primary" onclick="saveInvoice()">Post</button></div>`)}
async function saveInvoice(){await saveEdit('/api/invoices',{vendorId:$('iVendor').value,number:$('iNo').value,amount:n($('iAmt').value),invoiceDate:$('iDate').value,dueDate:$('iDue').value||undefined,poId:$('iPO').value||undefined},'POST')}
function editInvoice(x){openModal('Update Invoice',`<div class="form"><label>Status<select id="invStatus">${['PENDING','APPROVED','REJECTED','PARTIAL','CLOSED','CANCELLED'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="right section"><button class="btn primary" onclick="saveEdit('/api/invoices/${x.id}',{status:$('invStatus').value})">Save</button></div>`)}
async function openPayment(){const [vs,inv]=await Promise.all([api('/api/vendors'),api('/api/invoices')]);openModal('Record Payment',`<div class="form"><label>Vendor<select id="pVendor"><option value="">None</option>${vs.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select></label><label>Invoice<select id="pInv"><option value="">None</option>${inv.map(i=>`<option value="${i.id}">${esc(i.number)} — ${money(i.amount)}</option>`).join('')}</select></label><label>Amount<input id="pAmt" type="number" min=".01"></label><label>Method<select id="pMethod"><option>BANK</option><option>UPI</option><option>CASH</option><option>CHEQUE</option><option>OTHER</option></select></label><label>Reference<input id="pRef"></label></div><div class="right section"><button class="btn primary" onclick="savePayment()">Save payment</button></div>`)}
async function savePayment(){await saveEdit('/api/payments',{vendorId:$('pVendor').value||undefined,invoiceId:$('pInv').value||undefined,amount:n($('pAmt').value),method:$('pMethod').value,reference:$('pRef').value},'POST')}
async function openExpense(){openModal('Record Expense',`<div class="form"><label>Category<input id="xCat"></label><label>Description<input id="xDesc"></label><label>Amount<input id="xAmt" type="number" min=".01"></label><label>Date<input id="xDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><div class="right section"><button class="btn primary" onclick="saveExpense()">Save expense</button></div>`)}async function saveExpense(){await saveEdit('/api/expenses',{category:$('xCat').value,description:$('xDesc').value,amount:n($('xAmt').value),expenseDate:$('xDate').value},'POST')}

async function reports(){const s=await api('/api/reports/summary');$('reports').innerHTML=`<div class="title">Reports & Generate</div><div class="sub">Live management summaries plus downloadable CSV reports.</div><div class="cards">${card('Vendors',s.vendors)}${card('Materials',s.materials)}${card('PRs',s.prs)}${card('PO Value',money(s.totalPO))}${card('Invoice Value',money(s.invoiceAmount))}${card('Paid',money(s.paidAmount))}${card('Expenses',money(s.expenses))}${card('Employees',s.employees)}${card('Labour',s.labour)}${card('Stock Qty',s.stockQty)}</div><div class="panel"><div class="toolbar"><b>Generate detailed report</b><span class="notice">CSV opens in Excel / Google Sheets.</span></div><div class="tabs"><button class="btn primary" onclick="generate('vendors')">Generate Vendors</button><button class="btn primary" onclick="generate('materials')">Generate Materials</button><button class="btn primary" onclick="generate('employees')">Generate Employees</button><button class="btn primary" onclick="generate('invoices')">Generate Invoices</button><button class="btn primary" onclick="generate('audit')">Generate Audit</button></div><div class="ok">Report engine ready · generated at ${new Date(s.generatedAt).toLocaleString()}</div></div>`}
async function generate(type){try{const r=await fetch(API+'/api/reports/generate?type='+encodeURIComponent(type),{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw new Error('Report generation failed');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ezyprocure-'+type+'-'+Date.now()+'.csv';a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}}

async function settings(){const d=await api('/api/settings');$('settings').innerHTML=`<div class="title">Settings & Security</div><div class="sub">Company configuration, profile and password controls.</div><div class="grid"><div class="panel"><div class="toolbar"><b>Company settings</b>${me.role==='ADMIN'||me.role==='MANAGEMENT'?'<button class="btn primary" onclick="saveSettings()">Save changes</button>':''}</div><div class="form"><label>Company name<input id="cName" value="${esc(d.company.name)}"></label><label>GSTIN<input id="cGstin" value="${esc(d.company.gstin||'')}"></label><label>Country code<input id="cCountry" value="${esc(d.company.countryCode)}"></label><label>Base currency<input id="cCurrency" value="${esc(d.company.baseCurrency)}"></label><label class="span3">Timezone<input id="cTimezone" value="${esc(d.company.timezone)}"></label></div><div class="notice">Only Admin/Management can save company configuration.</div></div><div class="panel"><b>My security</b><p class="notice">Edit your name/email or change your login password.</p><button class="btn primary" onclick="openSettings('profile')">Edit profile</button> <button class="btn" onclick="openSettings('password')">Change password</button></div></div>`}
async function saveSettings(){try{await api('/api/settings',{method:'PUT',body:JSON.stringify({name:$('cName').value,gstin:$('cGstin').value,countryCode:$('cCountry').value,baseCurrency:$('cCurrency').value,timezone:$('cTimezone').value})});alert('Settings saved');reloadCurrent()}catch(e){alert(e.message)}}
async function openSettings(tab){if(tab==='profile')openModal('Edit My Profile',`<div class="form"><label>Name<input id="pName" value="${esc(me.name)}"></label><label>Email<input id="pEmail" type="email" value="${esc(me.email)}"></label></div><div class="right section"><button class="btn primary" onclick="saveProfile()">Save profile</button></div>`);else openModal('Change Login Password',`<div class="form"><label>Current password<input id="oldPass" type="password" autocomplete="current-password"></label><label>New password<input id="newPass" type="password" autocomplete="new-password"></label><label>Confirm password<input id="newPass2" type="password" autocomplete="new-password"></label></div><div class="notice">Minimum 10 characters.</div><div class="right section"><button class="btn primary" onclick="changePassword()">Change password</button></div>`)}
async function saveProfile(){try{const u=await api('/api/auth/me',{method:'PUT',body:JSON.stringify({name:$('pName').value,email:$('pEmail').value})});me={...me,...u};$('userBox').innerHTML=`<b>${esc(me.name)}</b><small>${esc(me.role)} · ${esc(me.department)}</small>`;closeModal();alert('Profile updated')}catch(e){alert(e.message)}}
async function changePassword(){try{await api('/api/auth/change-password',{method:'PUT',body:JSON.stringify({currentPassword:$('oldPass').value,newPassword:$('newPass').value,confirmPassword:$('newPass2').value})});closeModal();alert('Password changed successfully. Please sign in again.');logout()}catch(e){alert(e.message)}}

async function users(){const [us,ds]=await Promise.all([api('/api/users'),api('/api/departments')]);$('users').innerHTML=`<div class="toolbar"><div><div class="title">User Management</div><div class="sub">Create users, change roles, deactivate access and reset passwords.</div></div>${me.role==='ADMIN'?'<button class="btn primary" onclick="openUser()">+ New User</button>':''}</div><div class="panel"><div class="table"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Active</th><th>Actions</th></tr>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.department)}</td><td>${u.active?'Yes':'No'}</td><td>${me.role==='ADMIN'?`<button class="btn" onclick='editUser(${JSON.stringify(u)},${JSON.stringify(ds)})'>Edit</button> <button class="btn" onclick='resetUser(${JSON.stringify(u)})'>Reset password</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No users</td></tr>'}</table></div></div>`}
async function openUser(u={},ds=[]){if(!ds.length)ds=await api('/api/departments');openModal(u.id?'Edit User':'Create User',`<div class="form"><label>Name<input id="uName" value="${esc(u.name||'')}"></label><label>Email<input id="uEmail" type="email" value="${esc(u.email||'')}"></label>${u.id?'':'<label>Initial password<input id="uPass" type="password" value="Welcome@2026!</label>'}<label>Role<select id="uRole">${['ADMIN','PROCUREMENT','SITE_STORE','SITE_ENGINEER','ACCOUNTS','HR','MANAGEMENT'].map(r=>`<option ${r===u.role?'selected':''}>${r}</option>`).join('')}</select></label><label>Department<select id="uDept"><option value="">Owner / Administration</option>${ds.map(d=>`<option value="${d.id}" ${d.id===u.departmentId?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label>Active<select id="uActive"><option value="true" ${u.active!==false?'selected':''}>Active</option><option value="false" ${u.active===false?'selected':''}>Disabled</option></select></label></div><div class="right section"><button class="btn primary" onclick='saveUser(${u.id?`"${u.id}"`:'null'})'>Save</button></div>`)}
async function saveUser(id){try{const body={name:$('uName').value,email:$('uEmail').value,role:$('uRole').value,departmentId:$('uDept').value||null};if(id){body.active=$('uActive').value==='true';await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify(body)})}else{body.password=$('uPass').value;await api('/api/users',{method:'POST',body:JSON.stringify(body)})}closeModal();reloadCurrent()}catch(e){alert(e.message)}}
function editUser(u,d){openUser(u,d)}function resetUser(u){openModal('Reset User Password',`<div class="form"><label>New password<input id="rPass" type="password" value="Welcome@2026!"></label></div><div class="right section"><button class="btn primary" onclick="doReset('${u.id}')">Reset password</button></div>`)}async function doReset(id){try{await api('/api/users/'+id+'/reset-password',{method:'POST',body:JSON.stringify({password:$('rPass').value})});closeModal();alert('Password reset successfully')}catch(e){alert(e.message)}}
async function audit(){const rows=await api('/api/audit');$('audit').innerHTML=`<div class="title">Audit & Control</div><div class="sub">Who changed what, when, and from which session.</div><div class="panel"><div class="table"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>ID</th></tr>${rows.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString()}</td><td>${esc(x.user?.name)}</td><td>${esc(x.action)}</td><td>${esc(x.entityType)}</td><td>${esc(x.entityId)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No audit activity</td></tr>'}</table></div></div>`}
$('search').addEventListener('input',()=>{const q=$('search').value.toLowerCase();document.querySelectorAll('.page.active tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
async function init(){if(!token){location.href='./login.html';return}try{me=await api('/api/auth/me');const p=await api('/api/me/permissions');perms=p.permissions||[];$('userBox').innerHTML=`<b>${esc(me.name)}</b><small>${esc(me.role)} · ${esc(me.department)}</small>`;buildNav();show('dashboard')}catch(e){document.body.innerHTML=`<div style="padding:40px;font-family:system-ui"><h2>Backend connection failed</h2><p>${esc(e.message)}</p><button class="btn primary" onclick="location.href='./login.html'">Back to login</button></div>`}}
init();
</script></body></html>
