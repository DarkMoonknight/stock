<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EzyProcure Enterprise</title><meta name="description" content="Department-aware procurement, finance, HR and site operations platform"><style>
:root{--nav:#071b33;--brand:#0a9b69;--bg:#f5f7fb;--line:#e5eaf1;--ink:#172033;--muted:#718096;--card:#fff;--danger:#c53030;--warn:#a66b00}*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.layout{display:flex;min-height:100vh}.side{width:260px;background:var(--nav);color:#d8e2ef;position:fixed;inset:0 auto 0 0;padding:18px 14px;overflow:auto}.brand{font-size:22px;font-weight:800;padding:8px 10px 20px}.brand span{color:#16c985}.who{background:#0e2a47;border:1px solid #23405d;border-radius:12px;padding:12px;margin:0 4px 14px}.who b{display:block;color:white}.who small{color:#8fa6bd}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#c6d5e5;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.on{background:var(--brand);color:#fff}.main{margin-left:260px;width:calc(100% - 260px);padding:22px}.top{display:flex;gap:10px;align-items:center;margin-bottom:18px}.search{flex:1;padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:10px}.btn{border:1px solid #d8e0e9;background:#fff;padding:10px 13px;border-radius:9px;cursor:pointer}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.danger{background:#fff0f0;border-color:#ffd2d2;color:var(--danger)}.title{font-size:26px;font-weight:800}.sub{color:var(--muted);margin-top:4px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 4px 16px #1020390b}.metric{font-size:24px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.table{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left;white-space:nowrap}th{color:#59677a;font-size:12px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef9f4;color:#087a52;font-size:11px}.tag.warn{background:#fff6df;color:var(--warn)}.tag.bad{background:#fff0f0;color:var(--danger)}.page{display:none}.page.on{display:block}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.form input,.form select,.form textarea{width:100%;padding:10px;border:1px solid #dbe2eb;border-radius:8px;background:#fff}.form textarea{min-height:80px}.span2{grid-column:span 2}.span3{grid-column:span 3}.empty{padding:28px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#071b3388;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.modalbox{background:#fff;border-radius:16px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px}.mobile{display:none}@media(max-width:1200px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}}@media(max-width:760px){.side{width:72px;padding:12px 8px}.brand{font-size:0}.brand span{font-size:18px}.who{display:none}.nav button{font-size:0;text-align:center;padding:12px}.nav button::first-letter{font-size:18px}.main{margin-left:72px;width:calc(100% - 72px);padding:12px}.top{flex-wrap:wrap}.search{flex-basis:100%}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.span2,.span3{grid-column:span 1}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">⬡ <span>EzyProcure</span></div><div class="who" id="who">Loading…</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><input id="globalSearch" class="search" placeholder="Search purchase, site, employee, vendor, invoice…"><button class="btn" onclick="location.reload()">↻ Refresh</button><button class="btn" onclick="logout()">Sign out</button></div><section id="dashboard" class="page on"></section><section id="procurement" class="page"></section><section id="site" class="page"></section><section id="hr" class="page"></section><section id="accounts" class="page"></section><section id="admin" class="page"></section></main></div><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="modalbox" id="modalbox"></div></div><script>
const API='https://ezyprocure-api.onrender.com';const token=localStorage.getItem('ezyprocure_token');if(!token)location.href='./login.html';let me=null,perms=[];const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(r.status===401){logout();throw new Error('Session expired')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function logout(){localStorage.removeItem('ezyprocure_token');localStorage.removeItem('ezyprocure_user');location.href='./login.html'}
const can=x=>perms.includes('*')||perms.includes(x);function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===id))}
function nav(){const items=[['dashboard','▣ Dashboard',true],['procurement','▤ Procurement',can('procurement')||can('pr')],['site','⌂ Site Operations',can('site')||can('sites')],['hr','♙ HR & Labour',can('hr')||can('employees')],['accounts','₹ Accounts & Finance',can('accounts')||can('invoices')],['admin','⚙ Controls & Audit',me.role==='ADMIN']];$('nav').innerHTML=items.filter(x=>x[2]).map(x=>`<button data-page="${x[0]}" onclick="show('${x[0]}')">${x[1]}</button>`).join('');}
function card(label,val,sub=''){return`<div class="card"><div>${label}</div><div class="metric">${val}</div><div class="sub">${sub}</div></div>`}function esc(x){return String(x??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function dashboard(){try{const d=await api('/api/dashboard');$('dashboard').innerHTML=`<div class="title">Enterprise Command Center</div><div class="sub">One control plane for procurement, finance, HR and every site.</div><div class="cards">${card('Pending PR',d.pendingPR,'Purchase approvals')}${card('Open RFQ',d.pendingRFQ,'Supplier sourcing')}${card('Open PO',d.openPO,'Commitments')}${card('GRN Queue',d.openGRN,'Site receipts')}${card('MRN Queue',d.pendingMRN,'Material requests')}${card('Invoices',d.pendingInvoices,'Accounts payable')}${card('Vendors',d.activeVendors,'Active suppliers')}${card('Employees',d.employees,'HR masters')}${card('Labour',d.activeLabour,'Site workforce')}${card('Expenses','₹'+Number(d.totalExpenses||0).toLocaleString('en-IN'),'Recorded expenses')}</div><div class="grid"><div class="panel"><div class="toolbar"><b>Department access</b><span class="tag">${esc(me.department)}</span></div><div class="table"><table><tr><th>Department</th><th>Primary work</th><th>Access</th></tr><tr><td>Purchase</td><td>PR → RFQ → Quote → PO</td><td>${can('procurement')?'Active':'Restricted'}</td></tr><tr><td>Accounts</td><td>Invoices → Payments → Expenses</td><td>${can('accounts')?'Active':'Restricted'}</td></tr><tr><td>HR</td><td>Employees → Attendance → Labour</td><td>${can('hr')?'Active':'Restricted'}</td></tr><tr><td>Site</td><td>MRN → GRN → Stock → Tasks</td><td>${can('site')?'Active':'Restricted'}</td></tr></table></div></div><div class="panel"><b>Security model</b><p class="sub">Role-based access is enforced in the API, not only in the UI. Owner/Admin has full access; every department sees only its permitted workflows.</p><div class="tag">Audit logging enabled</div></div></div>`}catch(e){$('dashboard').innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}
async function procurement(){const [sites,materials,vendors,prs,rfqs,pos]=await Promise.all([api('/api/sites'),api('/api/materials'),api('/api/vendors'),api('/api/pr'),api('/api/rfq'),api('/api/po')]);$('procurement').innerHTML=`<div class="toolbar"><div><div class="title">Procurement Control</div><div class="sub">Purchase team owns sourcing. Site team can raise demand; accounts sees the financial trail.</div></div><button class="btn primary" onclick="openPRForm(${JSON.stringify(sites).replace(/"/g,'&quot;')},${JSON.stringify(materials).replace(/"/g,'&quot;')})">+ New PR</button></div><div class="grid" style="margin-top:14px"><div class="panel"><b>Purchase Requisitions</b><div class="table"><table><tr><th>PR</th><th>Site</th><th>Status</th><th>Required</th></tr>${prs.map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.site?.name)}</td><td><span class="tag">${x.status}</span></td><td>${new Date(x.requiredDate).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No PRs</td></tr>'}</table></div></div><div class="panel"><b>RFQs & POs</b><div class="table"><table><tr><th>RFQ/PO</th><th>Vendor</th><th>Status</th></tr>${rfqs.slice(0,6).map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.vendors?.[0]?.vendor?.name||'—')}</td><td>${x.status}</td></tr>`).join('')}${pos.slice(0,6).map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.vendor?.name)}</td><td>${x.status}</td></tr>`).join('')}</table></div></div></div>`}
function openPRForm(sites,materials){openModal(`<h2>Create Purchase Requisition</h2><div class="form"><select id="fSite">${sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input id="fReq" value="${esc(me.name)}" placeholder="Requested by"><input id="fDate" type="date" value="${new Date(Date.now()+7*86400000).toISOString().slice(0,10)}"><select id="fMat">${materials.map(m=>`<option value="${m.id}">${esc(m.code)} — ${esc(m.name)}</option>`).join('')}</select><input id="fQty" type="number" min="0.001" step="0.001" value="1" placeholder="Qty"><input id="fRate" type="number" min="0" step="0.01" value="0" placeholder="Estimated rate"><textarea id="fNotes" class="span3" placeholder="Notes / site requirement"></textarea></div><div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="savePR()">Save PR</button></div>`)}
async function savePR(){try{await api('/api/pr',{method:'POST',body:JSON.stringify({siteId:$('fSite').value,requestedBy:$('fReq').value,requiredDate:$('fDate').value,notes:$('fNotes').value,items:[{materialId:$('fMat').value,quantity:Number($('fQty').value),estimatedRate:Number($('fRate').value)}]})});closeModal();procurement();}catch(e){alert(e.message)}}
async function site(){const [sites,mrns,grns,stock,tasks,labour,att]=await Promise.all([api('/api/sites'),api('/api/mrn'),api('/api/grn'),api('/api/stock'),api('/api/tasks').catch(()=>[]),api('/api/labour').catch(()=>[]),api('/api/labour/attendance').catch(()=>[])]);$('site').innerHTML=`<div class="title">Site Operations</div><div class="sub">Every site gets its own operational view: demand, receiving, stock, workforce and daily execution.</div><div class="cards">${card('Sites',sites.length,'Active sites')}${card('MRNs',mrns.length,'Material requests')}${card('GRNs',grns.length,'Receipts')}${card('Stock lines',stock.length,'Site/material balances')}${card('Tasks',tasks.length,'Engineering actions')}${card('Labour attendance',att.length,'Daily records')}</div><div class="grid"><div class="panel"><div class="toolbar"><b>Material Requests</b>${can('site')?'<button class="btn primary" onclick="openMRNForm()">+ New MRN</button>':''}</div><div class="table"><table><tr><th>MRN</th><th>Site</th><th>Purpose</th><th>Status</th></tr>${mrns.slice(0,10).map(x=>`<tr><td>${x.number}</td><td>${x.site.name}</td><td>${esc(x.purpose)}</td><td><span class="tag">${x.status}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No MRNs</td></tr>'}</table></div></div><div class="panel"><b>Site Stock</b><div class="table"><table><tr><th>Site</th><th>Material</th><th>Qty</th></tr>${stock.slice(0,12).map(x=>`<tr><td>${x.site.name}</td><td>${x.material.name}</td><td>${x.quantity}</td></tr>`).join('')}</table></div></div></div>`}
async function openMRNForm(){const [sites,m]=await Promise.all([api('/api/sites'),api('/api/materials')]);openModal(`<h2>Material Requisition Note (MRN)</h2><div class="form"><select id="mSite">${sites.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input id="mReq" value="${esc(me.name)}"><input id="mDate" type="date" value="${new Date(Date.now()+86400000).toISOString().slice(0,10)}"><input id="mQty" type="number" value="1" min="0.001"><select id="mMat">${m.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)}</option>`).join('')}</select><input id="mPurpose" placeholder="Purpose"></div><div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveMRN()">Create MRN</button></div>`)}
async function saveMRN(){try{await api('/api/mrn',{method:'POST',body:JSON.stringify({siteId:$('mSite').value,requestedBy:$('mReq').value,requiredDate:$('mDate').value,purpose:$('mPurpose').value,items:[{materialId:$('mMat').value,quantity:Number($('mQty').value)}]})});closeModal();site();}catch(e){alert(e.message)}}
async function hr(){const [emp,lab,att,sites]=await Promise.all([api('/api/employees'),api('/api/labour'),api('/api/employees/attendance').catch(()=>[]),api('/api/sites')]);$('hr').innerHTML=`<div class="title">HR & Workforce</div><div class="sub">Employees, labour contractors and daily attendance in one controlled workspace.</div><div class="cards">${card('Employees',emp.length,'Active staff')}${card('Labour',lab.length,'Active workforce')}${card('Attendance',att.length,'Employee records')}</div><div class="grid"><div class="panel"><div class="toolbar"><b>Employees</b>${can('hr')?'<button class="btn primary" onclick="openEmployeeForm()">+ Employee</button>':''}</div><div class="table"><table><tr><th>Code</th><th>Name</th><th>Designation</th><th>Department</th></tr>${emp.map(x=>`<tr><td>${x.employeeCode}</td><td>${esc(x.name)}</td><td>${esc(x.designation)}</td><td>${esc(x.department?.name||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No employees</td></tr>'}</table></div></div><div class="panel"><b>Labour & Site Attendance</b><div class="table"><table><tr><th>Labour</th><th>Site</th><th>Date</th><th>Status</th></tr>${(await api('/api/labour/attendance')).slice(0,10).map(x=>`<tr><td>${esc(x.labour.name)}</td><td>${esc(x.site.name)}</td><td>${new Date(x.date).toLocaleDateString()}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No labour attendance</td></tr>'}</table></div></div></div>`}
async function openEmployeeForm(){const depts=await api('/api/departments');openModal(`<h2>New Employee</h2><div class="form"><input id="eCode" placeholder="Employee code"><input id="eName" placeholder="Full name"><input id="eEmail" placeholder="Email"><input id="ePhone" placeholder="Phone"><input id="eDes" placeholder="Designation"><select id="eDept">${depts.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><input id="eJoin" type="date"><input id="eSalary" type="number" min="0" placeholder="Salary"></div><div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveEmployee()">Create</button></div>`)}
async function saveEmployee(){try{await api('/api/employees',{method:'POST',body:JSON.stringify({employeeCode:$('eCode').value,name:$('eName').value,email:$('eEmail').value,phone:$('ePhone').value,designation:$('eDes').value,departmentId:$('eDept').value,joiningDate:$('eJoin').value,salary:Number($('eSalary').value||0)})});closeModal();hr();}catch(e){alert(e.message)}}
async function accounts(){const [inv,pay,exp]=await Promise.all([api('/api/invoices'),api('/api/payments'),api('/api/expenses')]);$('accounts').innerHTML=`<div class="title">Accounts & Finance</div><div class="sub">Accounts controls invoices, payments and expenses. Purchase can create POs, but only Accounts can post financial transactions.</div><div class="cards">${card('Open invoices',inv.length,'AP queue')}${card('Payments',pay.length,'Settlements')}${card('Expenses',exp.length,'Operating spend')}</div><div class="grid"><div class="panel"><div class="toolbar"><b>Invoices</b>${can('accounts')?'<button class="btn primary" onclick="openInvoiceForm()">+ Invoice</button>':''}</div><div class="table"><table><tr><th>Invoice</th><th>Vendor</th><th>Amount</th><th>Status</th></tr>${inv.map(x=>`<tr><td>${esc(x.number)}</td><td>${esc(x.vendor?.name)}</td><td>₹${num(x.amount).toLocaleString('en-IN')}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No invoices</td></tr>'}</table></div></div><div class="panel"><b>Recent Payments & Expenses</b><div class="table"><table><tr><th>Type</th><th>Reference</th><th>Amount</th></tr>${pay.slice(0,6).map(x=>`<tr><td>Payment</td><td>${esc(x.reference||x.method)}</td><td>₹${num(x.amount).toLocaleString('en-IN')}</td></tr>`).join('')}${exp.slice(0,6).map(x=>`<tr><td>Expense</td><td>${esc(x.description)}</td><td>₹${num(x.amount).toLocaleString('en-IN')}</td></tr>`).join('')}</table></div></div></div>`}
async function openInvoiceForm(){const vendors=await api('/api/vendors');openModal(`<h2>Post Vendor Invoice</h2><div class="form"><select id="iVendor">${vendors.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select><input id="iNo" placeholder="Invoice no"><input id="iAmt" type="number" min="0" step="0.01" placeholder="Amount"><input id="iDate" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="iDue" type="date"><input id="iPo" placeholder="PO id (optional)"></div><div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveInvoice()">Post Invoice</button></div>`)}
async function saveInvoice(){try{await api('/api/invoices',{method:'POST',body:JSON.stringify({vendorId:$('iVendor').value,number:$('iNo').value,amount:Number($('iAmt').value),invoiceDate:$('iDate').value,dueDate:$('iDue').value||undefined,poId:$('iPo').value||undefined})});closeModal();accounts();}catch(e){alert(e.message)}}
async function admin(){const logs=await api('/api/audit');$('admin').innerHTML=`<div class="title">Owner Controls & Audit</div><div class="sub">Full access console for the software owner. Department permissions remain API-enforced.</div><div class="panel" style="margin-top:14px"><b>Recent audit activity</b><div class="table"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th></tr>${logs.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString()}</td><td>${esc(x.user?.name)}</td><td>${esc(x.action)}</td><td>${esc(x.entityType)} ${esc(x.entityId||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No audit activity yet</td></tr>'}</table></div></div>`}
function openModal(html){$('modalbox').innerHTML=html;$('modal').classList.add('on')}function closeModal(){$('modal').classList.remove('on')}
async function init(){try{me=await api('/api/auth/me');const p=await api('/api/me/permissions');perms=p.permissions||[];$('who').innerHTML=`<b>${esc(me.name)}</b><small>${esc(me.role)} · ${esc(me.department)}</small>`;nav();await dashboard();if(can('procurement'))await procurement();if(can('site'))await site();if(can('hr'))await hr();if(can('accounts'))await accounts();if(me.role==='ADMIN')await admin();}catch(e){document.body.innerHTML='<div style="padding:40px;font-family:system-ui"><h2>Session/API error</h2><p>'+esc(e.message)+'</p></div>'}}
init();
</script></body></html>
