<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>EzyProcure Enterprise</title><style>
:root{--n:#071b33;--b:#079b69;--bg:#f4f7fb;--c:#fff;--l:#e2e8f0;--t:#172033;--m:#718096;--d:#c53030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--n);color:#dbe6f0;padding:16px;overflow:auto}.brand{font-size:22px;font-weight:800;padding:8px}.brand span{color:#19cf8a}.me{background:#0d2946;border:1px solid #23415e;border-radius:12px;padding:12px;margin:12px 0}.me b{display:block;color:#fff}.me small{color:#9bb0c4}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#c8d5e2;text-align:left;padding:11px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.on{background:var(--b);color:#fff}.main{margin-left:250px;padding:20px}.top{display:flex;gap:8px;margin-bottom:18px}.search{flex:1;border:1px solid var(--l);border-radius:9px;padding:11px;background:#fff}.btn{border:1px solid #d3dce7;border-radius:8px;background:#fff;padding:9px 12px;cursor:pointer}.primary{background:var(--b);border-color:var(--b);color:#fff}.page{display:none}.page.on{display:block}.title{font-size:27px;font-weight:800}.sub{color:var(--m);margin-top:4px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;box-shadow:0 4px 15px #1020390a}.metric{font-size:23px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;white-space:nowrap}th{font-size:12px;color:#607084}.tag{padding:4px 8px;border-radius:99px;background:#eef9f4;color:#087a52;font-size:11px}.empty{text-align:center;color:var(--m);padding:25px}.error{padding:14px;border:1px solid #ffd0d0;background:#fff5f5;color:var(--d);border-radius:9px}.ok{padding:12px;border:1px solid #bdebd9;background:#f1fff9;color:#087a52;border-radius:9px}.modal{position:fixed;inset:0;background:#071b3380;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.on{display:flex}.box{background:#fff;border-radius:15px;width:min(800px,100%);max-height:92vh;overflow:auto;padding:20px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form label{font-size:12px;font-weight:700;color:#536175}.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #d8e1eb;border-radius:8px}.span{grid-column:span 3}.right{text-align:right;margin-top:16px}.section{margin-top:14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:700px){.side{width:68px;padding:8px}.brand{font-size:0}.brand span{font-size:18px}.me{display:none}.nav button{font-size:0;text-align:center}.nav button::first-letter{font-size:18px}.main{margin-left:68px;padding:10px}.cards{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.span{grid-column:auto}.top{flex-wrap:wrap}.search{flex-basis:100%}}
</style></head><body><aside class="side"><div class="brand">⬡ <span>EzyProcure</span></div><div id="me" class="me">Loading…</div><nav id="nav" class="nav"></nav></aside><main class="main"><div class="top"><input id="search" class="search" placeholder="Search this screen"><button class="btn" onclick="refresh()">↻ Refresh</button><button class="btn" onclick="settings('profile')">⚙ Settings</button><button class="btn" onclick="logout()">Sign out</button></div><section id="dashboard" class="page"></section><section id="procurement" class="page"></section><section id="site" class="page"></section><section id="hr" class="page"></section><section id="accounts" class="page"></section><section id="reports" class="page"></section><section id="settings" class="page"></section><section id="users" class="page"></section><section id="audit" class="page"></section></main><div id="modal" class="modal"><div id="box" class="box"></div></div><script>
const API='https://ezyprocure-api.onrender.com',token=localStorage.getItem('ezyprocure_token');let me=null,perms=[];const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>Number(x||0),money=x=>'₹'+num(x).toLocaleString('en-IN',{maximumFractionDigits:2});
async function api(p,o={}){let r;try{r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...(o.headers||{})},cache:'no-store'})}catch{throw Error('Backend is offline/unreachable')}let d={};try{d=await r.json()}catch{}if(r.status===401){logout();throw Error('Session expired')}if(!r.ok)throw Error(d.error||'API '+r.status);return d}
function logout(){localStorage.clear();location.href='./login.html'}function can(x){return perms.includes('*')||perms.includes(x)}function modal(title,html){$('box').innerHTML='<div class="bar"><h2>'+title+'</h2><button class="btn" onclick="closeM()">✕</button></div>'+html;$('modal').classList.add('on')}function closeM(){$('modal').classList.remove('on')}function refresh(){const id=document.querySelector('.page.on')?.id||'dashboard';load(id,true)}function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.p===id));load(id)}
const cache={};async function load(id,force=false){if(cache[id]&&!force)return;cache[id]=true;try{if(id==='dashboard')await dashboard();if(id==='procurement')await procurement();if(id==='site')await site();if(id==='hr')await hr();if(id==='accounts')await accounts();if(id==='reports')await reports();if(id==='settings')await companySettings();if(id==='users')await users();if(id==='audit')await audit()}catch(e){cache[id]=false;$(id).innerHTML='<div class="title">'+id+'</div><div class="error">'+esc(e.message)+'<br><br><button class="btn primary" onclick="load(\''+id+'\',true)">Retry</button></div>'}}
function card(a,b,c=''){return'<div class="card"><div>'+a+'</div><div class="metric">'+b+'</div><div class="sub">'+c+'</div></div>'}function nav(){let a=[['dashboard','▣ Dashboard',1],['procurement','▤ Procurement',can('procurement')],['site','⌂ Site Operations',can('site')||can('sites')],['hr','♙ HR & Labour',can('hr')],['accounts','₹ Accounts & Finance',can('accounts')],['reports','▥ Reports & Generate',can('reports')],['settings','⚙ Settings',can('settings')||me.role==='ADMIN'],['users','♙ User Management',me.role==='ADMIN'||me.role==='MANAGEMENT'],['audit','◷ Audit & Control',me.role==='ADMIN'||me.role==='MANAGEMENT']];$('nav').innerHTML=a.filter(x=>x[2]).map(x=>'<button data-p="'+x[0]+'" onclick="show(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
async function dashboard(){let d=await api('/api/dashboard');$('dashboard').innerHTML='<div class="title">Enterprise Command Center</div><div class="sub">Advanced ERP control panel with edit, security and report generation.</div><div class="cards">'+card('Pending PR',d.pendingPR,'Purchase requests')+card('Open RFQ',d.pendingRFQ)+card('Open PO',d.openPO)+card('GRN Queue',d.openGRN)+card('MRN Queue',d.pendingMRN)+card('Invoices',d.pendingInvoices)+card('Vendors',d.activeVendors)+card('Employees',d.employees)+card('Labour',d.activeLabour)+card('Tasks',d.openTasks)+card('Expenses',money(d.totalExpenses))+'</div><div class="grid"><div class="panel"><div class="bar"><b>Quick actions</b></div><div class="tabs">'+(can('procurement')?'<button class="btn primary" onclick="show(\'procurement\');newPR()">+ New PR</button>':'')+(can('site')?'<button class="btn" onclick="show(\'site\');newMRN()">+ New MRN</button>':'')+(can('accounts')?'<button class="btn" onclick="show(\'accounts\');newInvoice()">+ Invoice</button>':'')+(can('hr')?'<button class="btn" onclick="show(\'hr\');newEmployee()">+ Employee</button>':'')+'</div></div><div class="panel"><b>Security</b><p class="sub">'+esc(me.name)+' · '+esc(me.role)+' · '+esc(me.department||'Owner / Administration')+'</p><button class="btn" onclick="settings(\'profile\')">Edit profile</button> <button class="btn" onclick="settings(\'password\')">Change password</button></div></div>'}
async function procurement(){let [sites,mats,prs,rfqs,pos,vs]=await Promise.all([api('/api/sites'),api('/api/materials'),api('/api/pr'),api('/api/rfq'),api('/api/po'),api('/api/vendors')]);$('procurement').innerHTML='<div class="bar"><div><div class="title">Procurement</div><div class="sub">Editable PR, RFQ, PO and vendor masters.</div></div><div>'+ (can('procurement')?'<button class="btn primary" onclick="newPR()">+ PR</button> <button class="btn" onclick="newRFQ()">+ RFQ</button> <button class="btn" onclick="newPO()">+ PO</button>':'')+'</div></div><div class="grid"><div class="panel"><div class="bar"><b>Purchase Requisitions</b></div><div class="table"><table><tr><th>PR</th><th>Site</th><th>Status</th><th>Required</th><th></th></tr>'+prs.map(x=>'<tr><td>'+esc(x.number)+'</td><td>'+esc(x.site?.name)+'</td><td><span class="tag">'+esc(x.status)+'</span></td><td>'+new Date(x.requiredDate).toLocaleDateString()+'</td><td>'+(can('procurement')?'<button class="btn" onclick="editPR(\''+x.id+'\',\''+x.status+'\',\''+esc(x.notes||'').replace(/'/g,'&#39;')+'\')">Edit</button>':'')+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">No PRs</td></tr>'+'</table></div></div><div class="panel"><div class="bar"><b>PO / RFQ</b></div><div class="table"><table><tr><th>Reference</th><th>Vendor</th><th>Status</th><th></th></tr>'+rfqs.slice(0,8).map(x=>'<tr><td>'+esc(x.number)+'</td><td>'+esc(x.vendors?.[0]?.vendor?.name||'—')+'</td><td>'+esc(x.status)+'</td><td>RFQ</td></tr>').join('')+pos.slice(0,8).map(x=>'<tr><td>'+esc(x.number)+'</td><td>'+esc(x.vendor?.name)+'</td><td>'+esc(x.status)+'</td><td>'+(can('procurement')?'<button class="btn" onclick="editPO(\''+x.id+'\',\''+x.status+'\')">Edit</button>':'')+'</td></tr>').join('')+'</table></div></div></div><div class="panel section"><div class="bar"><b>Vendor Master</b>'+(can('procurement')||can('accounts')?'<button class="btn primary" onclick="newVendor()">+ Vendor</button>':'')+'</div><div class="table"><table><tr><th>Name</th><th>GSTIN</th><th>Phone</th><th>Days</th><th>Rating</th><th></th></tr>'+vs.map(v=>'<tr><td>'+esc(v.name)+'</td><td>'+esc(v.gstin)+'</td><td>'+esc(v.phone)+'</td><td>'+v.paymentDays+'</td><td>'+esc(v.rating)+'</td><td>'+(can('procurement')||can('accounts')?'<button class="btn" onclick="editVendor(\''+v.id+'\')">Edit</button>':'')+'</td></tr>').join('')+'</table></div></div>'}
async function newPR(){let [s,m]=await Promise.all([api('/api/sites'),api('/api/materials')]);modal('New Purchase Requisition','<div class="form"><label>Site<select id="a1">'+s.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Requested by<input id="a2" value="'+esc(me.name)+'"></label><label>Required date<input id="a3" type="date" value="'+new Date(Date.now()+7*86400000).toISOString().slice(0,10)+'"></label><label>Material<select id="a4">'+m.map(x=>'<option value="'+x.id+'">'+esc(x.code)+' — '+esc(x.name)+'</option>').join('')+'</select></label><label>Quantity<input id="a5" type="number" min=".001" value="1"></label><label>Estimated rate<input id="a6" type="number" min="0" value="0"></label><label class="span">Notes<textarea id="a7"></textarea></label></div><div class="right"><button class="btn primary" onclick="postPR()">Create PR</button></div>')}
async function postPR(){try{await api('/api/pr',{method:'POST',body:JSON.stringify({siteId:$('a1').value,requestedBy:$('a2').value,requiredDate:$('a3').value,notes:$('a7').value,items:[{materialId:$('a4').value,quantity:num($('a5').value),estimatedRate:num($('a6').value)}]})});closeM();refresh()}catch(e){alert(e.message)}}
function editPR(id,status,notes){modal('Edit PR','<div class="form"><label>Status<select id="e1">'+['DRAFT','PENDING','APPROVED','REJECTED','CANCELLED'].map(s=>'<option '+(s===status?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="span">Notes<textarea id="e2">'+esc(notes)+'</textarea></label></div><div class="right"><button class="btn primary" onclick="save('/api/pr/'+id,{status:$('e1').value,notes:$('e2').value})">Save</button></div>')}
async function newRFQ(){let [prs,vs]=await Promise.all([api('/api/pr'),api('/api/vendors')]);modal('New RFQ','<div class="form"><label>PR<select id="q1">'+prs.map(x=>'<option value="'+x.id+'">'+esc(x.number)+'</option>').join('')+'</select></label><label>Due date<input id="q2" type="date" value="'+new Date(Date.now()+7*86400000).toISOString().slice(0,10)+'"></label><label>Vendor<select id="q3">'+vs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label></div><div class="right"><button class="btn primary" onclick="postRFQ()">Create RFQ</button></div>')}
async function postRFQ(){await save('/api/rfq',{prId:$('q1').value,dueDate:$('q2').value,vendorIds:[$('q3').value]},'POST')}
async function newPO(){let [s,v,m]=await Promise.all([api('/api/sites'),api('/api/vendors'),api('/api/materials')]);modal('New Purchase Order','<div class="form"><label>Site<select id="o1">'+s.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Vendor<select id="o2">'+v.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Material<select id="o3">'+m.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Quantity<input id="o4" type="number" min=".001" value="1"></label><label>Rate<input id="o5" type="number" min="0" value="0"></label><label>Tax<input id="o6" type="number" min="0" value="0"></label></div><div class="right"><button class="btn primary" onclick="postPO()">Create PO</button></div>')}
async function postPO(){await save('/api/po',{siteId:$('o1').value,vendorId:$('o2').value,items:[{materialId:$('o3').value,orderedQty:num($('o4').value),rate:num($('o5').value)}],tax:num($('o6').value)},'POST')}
function editPO(id,status){modal('Edit PO','<div class="form"><label>Status<select id="p1">'+['DRAFT','PENDING','APPROVED','REJECTED','SENT','PARTIAL','CLOSED','CANCELLED'].map(s=>'<option '+(s===status?'selected':'')+'>'+s+'</option>').join('')+'</select></label></div><div class="right"><button class="btn primary" onclick="save(\'/api/po/'+id+'\',{status:$('p1').value})">Save</button></div>')}
function newVendor(){vendorForm(null)}function editVendor(id){vendorForm(id)}async function vendorForm(id){let v=id?await api('/api/vendors/'+id).catch(()=>null):null;modal(id?'Edit Vendor':'New Vendor','<div class="form"><label>Name<input id="v1" value="'+esc(v?.name||'')+'"></label><label>GSTIN<input id="v2" value="'+esc(v?.gstin||'')+'"></label><label>PAN<input id="v3" value="'+esc(v?.pan||'')+'"></label><label>Phone<input id="v4" value="'+esc(v?.phone||'')+'"></label><label>Email<input id="v5" value="'+esc(v?.email||'')+'"></label><label>Payment days<input id="v6" type="number" value="'+(v?.paymentDays||0)+'"></label><label>Credit limit<input id="v7" type="number" value="'+(v?.creditLimit||0)+'"></label><label>Rating<input id="v8" type="number" min="0" max="5" step=".1" value="'+(v?.rating||'')+'"></label></div><div class="right"><button class="btn primary" onclick="saveVendor('+JSON.stringify(id)+')">Save</button></div>')}
async function saveVendor(id){await save(id?'/api/vendors/'+id:'/api/vendors',{name:$('v1').value,gstin:$('v2').value,pan:$('v3').value,phone:$('v4').value,email:$('v5').value,paymentDays:num($('v6').value),creditLimit:num($('v7').value),rating:$('v8').value?num($('v8').value):undefined},id?'PATCH':'POST')}

async function site(){let [s,mr,g,st,t]=await Promise.all([api('/api/sites'),api('/api/mrn'),api('/api/grn'),api('/api/stock'),api('/api/tasks').catch(()=>[])]);$('site').innerHTML='<div class="bar"><div><div class="title">Site Operations</div><div class="sub">Site master, MRN, GRN, stock and tasks.</div></div><div>'+(can('site')?'<button class="btn primary" onclick="newMRN()">+ MRN</button>':'')+(can('sites')?'<button class="btn" onclick="siteForm()">+ Site</button>':'')+'</div></div><div class="cards">'+card('Sites',s.length)+card('MRNs',mr.length)+card('GRNs',g.length)+card('Stock lines',st.length)+card('Tasks',t.length)+'</div><div class="grid"><div class="panel"><div class="bar"><b>Sites</b></div><div class="table"><table><tr><th>Code</th><th>Name</th><th>Location</th><th>Manager</th><th></th></tr>'+s.map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.location)+'</td><td>'+esc(x.manager)+'</td><td>'+(can('sites')?'<button class="btn" onclick="siteForm(\''+x.id+'\')">Edit</button>':'')+'</td></tr>').join('')+'</table></div></div><div class="panel"><div class="bar"><b>Receiving / Stock</b></div><div class="table"><table><tr><th>Type</th><th>Reference</th><th>Site</th><th>Status</th></tr>'+mr.slice(0,8).map(x=>'<tr><td>MRN</td><td>'+esc(x.number)+'</td><td>'+esc(x.site?.name)+'</td><td>'+esc(x.status)+'</td></tr>').join('')+g.slice(0,8).map(x=>'<tr><td>GRN</td><td>'+esc(x.number)+'</td><td>'+esc(x.site?.name)+'</td><td>'+esc(x.status)+'</td></tr>').join('')+'</table></div></div></div><div class="panel section"><b>Stock</b><div class="table"><table><tr><th>Site</th><th>Material</th><th>Qty</th><th>Unit</th></tr>'+st.map(x=>'<tr><td>'+esc(x.site?.name)+'</td><td>'+esc(x.material?.name)+'</td><td>'+esc(x.quantity)+'</td><td>'+esc(x.material?.unit)+'</td></tr>').join('')+'</table></div></div>'}
async function siteForm(id){let x=id? (await api('/api/sites')).find(a=>a.id===id):null;modal(id?'Edit Site':'New Site','<div class="form"><label>Code<input id="s1" value="'+esc(x?.code||'')+'"></label><label>Name<input id="s2" value="'+esc(x?.name||'')+'"></label><label>Location<input id="s3" value="'+esc(x?.location||'')+'"></label><label>Manager<input id="s4" value="'+esc(x?.manager||'')+'"></label></div><div class="right"><button class="btn primary" onclick="saveSite('+JSON.stringify(id)+')">Save</button></div>')}async function saveSite(id){await save(id?'/api/sites/'+id:'/api/sites',{code:$('s1').value,name:$('s2').value,location:$('s3').value,manager:$('s4').value},id?'PATCH':'POST')}
async function newMRN(){let [s,m]=await Promise.all([api('/api/sites'),api('/api/materials')]);modal('New MRN','<div class="form"><label>Site<select id="m1">'+s.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Requested by<input id="m2" value="'+esc(me.name)+'"></label><label>Required date<input id="m3" type="date" value="'+new Date(Date.now()+86400000).toISOString().slice(0,10)+'"></label><label>Material<select id="m4">'+m.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Quantity<input id="m5" type="number" min=".001" value="1"></label><label>Purpose<input id="m6"></label></div><div class="right"><button class="btn primary" onclick="postMRN()">Create MRN</button></div>')}async function postMRN(){await save('/api/mrn',{siteId:$('m1').value,requestedBy:$('m2').value,requiredDate:$('m3').value,purpose:$('m6').value,items:[{materialId:$('m4').value,quantity:num($('m5').value)}]},'POST')}

async function hr(){let [e,l,a]=await Promise.all([api('/api/employees'),api('/api/labour'),api('/api/employees/attendance').catch(()=>[])]);$('hr').innerHTML='<div class="bar"><div><div class="title">HR & Labour</div><div class="sub">Employee and workforce master data with editing.</div></div><div>'+(can('hr')?'<button class="btn primary" onclick="newEmployee()">+ Employee</button> <button class="btn" onclick="labourForm()">+ Labour</button>':'')+'</div></div><div class="cards">'+card('Employees',e.length)+card('Labour',l.length)+card('Attendance',a.length)+'</div><div class="grid"><div class="panel"><b>Employees</b><div class="table"><table><tr><th>Code</th><th>Name</th><th>Designation</th><th>Department</th><th></th></tr>'+e.map(x=>'<tr><td>'+esc(x.employeeCode)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.designation)+'</td><td>'+esc(x.department?.name)+'</td><td>'+(can('hr')?'<button class="btn" onclick="employeeForm(\''+x.id+'\')">Edit</button>':'')+'</td></tr>').join('')+'</table></div></div><div class="panel"><b>Labour</b><div class="table"><table><tr><th>Code</th><th>Name</th><th>Trade</th><th>Contractor</th><th></th></tr>'+l.map(x=>'<tr><td>'+esc(x.labourCode)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.trade)+'</td><td>'+esc(x.contractor)+'</td><td>'+(can('hr')?'<button class="btn" onclick="labourForm(\''+x.id+'\')">Edit</button>':'')+'</td></tr>').join('')+'</table></div></div></div>'}
async function newEmployee(){employeeForm(null)}async function employeeForm(id){let [all,ds]=await Promise.all([api('/api/employees'),api('/api/departments')]);let x=id?all.find(a=>a.id===id):null;modal(id?'Edit Employee':'New Employee','<div class="form"><label>Code<input id="h1" value="'+esc(x?.employeeCode||'')+'"></label><label>Name<input id="h2" value="'+esc(x?.name||'')+'"></label><label>Email<input id="h3" value="'+esc(x?.email||'')+'"></label><label>Phone<input id="h4" value="'+esc(x?.phone||'')+'"></label><label>Designation<input id="h5" value="'+esc(x?.designation||'')+'"></label><label>Department<select id="h6"><option value="">None</option>'+ds.map(d=>'<option value="'+d.id+'" '+(d.id===x?.departmentId?'selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select></label><label>Joining date<input id="h7" type="date" value="'+(x?.joiningDate?new Date(x.joiningDate).toISOString().slice(0,10):'')+'"></label><label>Salary<input id="h8" type="number" min="0" value="'+(x?.salary||'')+'"></label></div><div class="right"><button class="btn primary" onclick="saveEmployee('+JSON.stringify(id)+')">Save</button></div>')}async function saveEmployee(id){await save(id?'/api/employees/'+id:'/api/employees',{employeeCode:$('h1').value,name:$('h2').value,email:$('h3').value,phone:$('h4').value,designation:$('h5').value,departmentId:$('h6').value||undefined,joiningDate:$('h7').value||undefined,salary:num($('h8').value)},id?'PATCH':'POST')}
async function labourForm(id){let l=await api('/api/labour');let x=id?l.find(a=>a.id===id):null;modal(id?'Edit Labour':'New Labour','<div class="form"><label>Code<input id="l1" value="'+esc(x?.labourCode||'')+'"></label><label>Name<input id="l2" value="'+esc(x?.name||'')+'"></label><label>Trade<input id="l3" value="'+esc(x?.trade||'')+'"></label><label>Contractor<input id="l4" value="'+esc(x?.contractor||'')+'"></label><label>Phone<input id="l5" value="'+esc(x?.phone||'')+'"></label><label>Daily rate<input id="l6" type="number" min="0" value="'+(x?.dailyRate||'')+'"></label></div><div class="right"><button class="btn primary" onclick="saveLabour('+JSON.stringify(id)+')">Save</button></div>')}async function saveLabour(id){await save(id?'/api/labour/'+id:'/api/labour',{labourCode:$('l1').value,name:$('l2').value,trade:$('l3').value,contractor:$('l4').value,phone:$('l5').value,dailyRate:num($('l6').value)},id?'PATCH':'POST')}

async function accounts(){let [i,p,x]=await Promise.all([api('/api/invoices'),api('/api/payments'),api('/api/expenses')]);$('accounts').innerHTML='<div class="bar"><div><div class="title">Accounts & Finance</div><div class="sub">Invoices, payments and expenses.</div></div><div>'+(can('accounts')?'<button class="btn primary" onclick="newInvoice()">+ Invoice</button> <button class="btn" onclick="newPayment()">+ Payment</button> <button class="btn" onclick="newExpense()">+ Expense</button>':'')+'</div></div><div class="cards">'+card('Invoices',i.length)+card('Payments',p.length)+card('Expenses',x.length)+'</div><div class="panel"><b>Invoices</b><div class="table"><table><tr><th>Invoice</th><th>Vendor</th><th>Amount</th><th>Paid</th><th>Status</th><th></th></tr>'+i.map(v=>'<tr><td>'+esc(v.number)+'</td><td>'+esc(v.vendor?.name)+'</td><td>'+money(v.amount)+'</td><td>'+money(v.paidAmount)+'</td><td><span class="tag">'+esc(v.status)+'</span></td><td>'+(can('accounts')?'<button class="btn" onclick="editInvoice(\''+v.id+'\',\''+v.status+'\')">Edit</button>':'')+'</td></tr>').join('')+'</table></div></div>'}
async function newInvoice(){let v=await api('/api/vendors');modal('New Invoice','<div class="form"><label>Vendor<select id="i1">'+v.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Invoice no<input id="i2"></label><label>Amount<input id="i3" type="number" min=".01"></label><label>Invoice date<input id="i4" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Due date<input id="i5" type="date"></label></div><div class="right"><button class="btn primary" onclick="save('/api/invoices',{vendorId:$('i1').value,number:$('i2').value,amount:num($('i3').value),invoiceDate:$('i4').value,dueDate:$('i5').value||undefined},'POST')">Post invoice</button></div>')}function editInvoice(id,status){modal('Edit Invoice','<div class="form"><label>Status<select id="i6">'+['PENDING','APPROVED','REJECTED','PARTIAL','CLOSED','CANCELLED'].map(s=>'<option '+(s===status?'selected':'')+'>'+s+'</option>').join('')+'</select></label></div><div class="right"><button class="btn primary" onclick="save(\'/api/invoices/'+id+'\',{status:$('i6').value})">Save</button></div>')}async function newPayment(){let [v,i]=await Promise.all([api('/api/vendors'),api('/api/invoices')]);modal('New Payment','<div class="form"><label>Vendor<select id="y1"><option value="">None</option>'+v.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></label><label>Invoice<select id="y2"><option value="">None</option>'+i.map(x=>'<option value="'+x.id+'">'+esc(x.number)+'</option>').join('')+'</select></label><label>Amount<input id="y3" type="number" min=".01"></label><label>Method<select id="y4"><option>BANK</option><option>UPI</option><option>CASH</option><option>CHEQUE</option><option>OTHER</option></select></label><label>Reference<input id="y5"></label></div><div class="right"><button class="btn primary" onclick="save('/api/payments',{vendorId:$('y1').value||undefined,invoiceId:$('y2').value||undefined,amount:num($('y3').value),method:$('y4').value,reference:$('y5').value},'POST')">Save payment</button></div>')}async function newExpense(){modal('New Expense','<div class="form"><label>Category<input id="z1"></label><label>Description<input id="z2"></label><label>Amount<input id="z3" type="number" min=".01"></label><label>Date<input id="z4" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label></div><div class="right"><button class="btn primary" onclick="save(\'/api/expenses\',{category:$('z1').value,description:$('z2').value,amount:num($('z3').value),expenseDate:$('z4').value},\'POST\')">Save expense</button></div>')}

async function reports(){let s=await api('/api/reports/summary');$('reports').innerHTML='<div class="title">Reports & Generate</div><div class="sub">Generate detailed CSV reports for management and operations.</div><div class="cards">'+card('Vendors',s.vendors)+card('Materials',s.materials)+card('PRs',s.prs)+card('PO Value',money(s.totalPO))+card('Invoices',money(s.invoiceAmount))+card('Paid',money(s.paidAmount))+card('Expenses',money(s.expenses))+card('Employees',s.employees)+card('Labour',s.labour)+card('Stock Qty',s.stockQty)+'</div><div class="panel"><b>Generate reports</b><div class="tabs"><button class="btn primary" onclick="generate(\'vendors\')">Generate Vendors</button><button class="btn primary" onclick="generate(\'materials\')">Generate Materials</button><button class="btn primary" onclick="generate(\'employees\')">Generate Employees</button><button class="btn primary" onclick="generate(\'invoices\')">Generate Invoices</button><button class="btn primary" onclick="generate(\'audit\')">Generate Audit</button></div><div class="ok">Report engine ready · '+new Date(s.generatedAt).toLocaleString()+'</div></div>'}
async function generate(type){try{let r=await fetch(API+'/api/reports/generate?type='+type,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Generation failed');let b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ezyprocure-'+type+'.csv';a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}}

async function companySettings(){let d=await api('/api/settings');$('settings').innerHTML='<div class="title">Settings & Security</div><div class="sub">Company configuration and account security.</div><div class="grid"><div class="panel"><div class="bar"><b>Company settings</b>'+(me.role==='ADMIN'||me.role==='MANAGEMENT'?'<button class="btn primary" onclick="saveCompany()">Save</button>':'')+'</div><div class="form"><label>Name<input id="c1" value="'+esc(d.company.name)+'"></label><label>GSTIN<input id="c2" value="'+esc(d.company.gstin||'')+'"></label><label>Country<input id="c3" value="'+esc(d.company.countryCode)+'"></label><label>Currency<input id="c4" value="'+esc(d.company.baseCurrency)+'"></label><label class="span">Timezone<input id="c5" value="'+esc(d.company.timezone)+'"></label></div></div><div class="panel"><b>Login security</b><p class="sub">You can edit your account details and change your login password at any time.</p><button class="btn primary" onclick="settings(\'profile\')">Edit profile</button> <button class="btn" onclick="settings(\'password\')">Change password</button></div></div>'}async function saveCompany(){await save('/api/settings',{name:$('c1').value,gstin:$('c2').value,countryCode:$('c3').value,baseCurrency:$('c4').value,timezone:$('c5').value},'PUT')}
async function settings(type){if(type==='profile')modal('Edit profile','<div class="form"><label>Name<input id="r1" value="'+esc(me.name)+'"></label><label>Email<input id="r2" type="email" value="'+esc(me.email)+'"></label></div><div class="right"><button class="btn primary" onclick="saveProfile()">Save profile</button></div>');else modal('Change login password','<div class="form"><label>Current password<input id="r3" type="password"></label><label>New password<input id="r4" type="password"></label><label>Confirm password<input id="r5" type="password"></label></div><p class="sub">Minimum 10 characters.</p><div class="right"><button class="btn primary" onclick="changePass()">Change password</button></div>')}
async function saveProfile(){try{let u=await api('/api/auth/me',{method:'PUT',body:JSON.stringify({name:$('r1').value,email:$('r2').value})});me={...me,...u};$('me').innerHTML='<b>'+esc(me.name)+'</b><small>'+esc(me.role)+' · '+esc(me.department)+'</small>';closeM();alert('Profile updated')}catch(e){alert(e.message)}}async function changePass(){try{await api('/api/auth/change-password',{method:'PUT',body:JSON.stringify({currentPassword:$('r3').value,newPassword:$('r4').value,confirmPassword:$('r5').value})});closeM();alert('Password changed. Sign in again.');logout()}catch(e){alert(e.message)}}

async function users(){let [u,d]=await Promise.all([api('/api/users'),api('/api/departments')]);$('users').innerHTML='<div class="bar"><div><div class="title">User Management</div><div class="sub">Create users, edit roles, disable accounts and reset passwords.</div></div>'+(me.role==='ADMIN'?'<button class="btn primary" onclick="userForm()">+ User</button>':'')+'</div><div class="panel"><div class="table"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Active</th><th></th></tr>'+u.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.role)+'</td><td>'+esc(x.department)+'</td><td>'+x.active+'</td><td>'+(me.role==='ADMIN'?'<button class="btn" onclick="userForm(\''+x.id+'\')">Edit</button> <button class="btn" onclick="resetUser(\''+x.id+'\')">Reset password</button>':'')+'</td></tr>').join('')+'</table></div></div>'}
async function userForm(id){let [u,d]=await Promise.all([api('/api/users'),api('/api/departments')]);let x=id?u.find(a=>a.id===id):null;modal(id?'Edit user':'Create user','<div class="form"><label>Name<input id="u1" value="'+esc(x?.name||'')+'"></label><label>Email<input id="u2" type="email" value="'+esc(x?.email||'')+'"></label>'+(!id?'<label>Initial password<input id="u3" type="password" value="Welcome@2026!"></label>':'')+'<label>Role<select id="u4">'+['ADMIN','PROCUREMENT','SITE_STORE','SITE_ENGINEER','ACCOUNTS','HR','MANAGEMENT'].map(r=>'<option '+(r===x?.role?'selected':'')+'>'+r+'</option>').join('')+'</select></label><label>Department<select id="u5"><option value="">Owner / Administration</option>'+d.map(q=>'<option value="'+q.id+'" '+(q.id===x?.departmentId?'selected':'')+'>'+esc(q.name)+'</option>').join('')+'</select></label><label>Active<select id="u6"><option value="true">Active</option><option value="false" '+(x&&!x.active?'selected':'')+'>Disabled</option></select></label></div><div class="right"><button class="btn primary" onclick="saveUser('+JSON.stringify(id)+')">Save</button></div>')}
async function saveUser(id){let b={name:$('u1').value,email:$('u2').value,role:$('u4').value,departmentId:$('u5').value||null};if(id)b.active=$('u6').value==='true';else b.password=$('u3').value;await save(id?'/api/users/'+id:'/api/users',b,id?'PATCH':'POST')}
function resetUser(id){modal('Reset user password','<div class="form"><label>New password<input id="rp" type="password" value="Welcome@2026!"></label></div><div class="right"><button class="btn primary" onclick="save(\'/api/users/'+id+'/reset-password\',{password:$('rp').value},\'POST\')">Reset password</button></div>')}
async function audit(){let r=await api('/api/audit');$('audit').innerHTML='<div class="title">Audit & Control</div><div class="sub">Full activity trail.</div><div class="panel"><div class="table"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>ID</th></tr>'+r.map(x=>'<tr><td>'+new Date(x.createdAt).toLocaleString()+'</td><td>'+esc(x.user?.name)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entityType)+'</td><td>'+esc(x.entityId)+'</td></tr>').join('')+'</table></div></div>'}
async function save(url,body,method='PATCH'){try{await api(url,{method,body:JSON.stringify(body)});closeM();refresh()}catch(e){alert(e.message)}}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};$('search').oninput=()=>{let q=$('search').value.toLowerCase();document.querySelectorAll('.page.on tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')};
(async function(){if(!token){location.href='./login.html';return}try{me=await api('/api/auth/me');perms=(await api('/api/me/permissions')).permissions||[];$('me').innerHTML='<b>'+esc(me.name)+'</b><small>'+esc(me.role)+' · '+esc(me.department)+'</small>';nav();show('dashboard')}catch(e){document.body.innerHTML='<div style="padding:40px;font-family:system-ui"><h2>Backend connection failed</h2><p>'+esc(e.message)+'</p><button class="btn primary" onclick="location.href=\'./login.html\'">Back to login</button></div>'}})();
</script></body></html>
