<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>EzyProcure Approvals</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:14px system-ui}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;gap:8px;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin-top:16px}.btn{border:1px solid #ccd6e2;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#079b69;color:#fff;border-color:#079b69}.danger{background:#c53030;color:#fff;border-color:#c53030}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;white-space:nowrap}.tag{padding:4px 8px;border-radius:99px;background:#eef9f4;color:#087a52}.error{padding:12px;background:#fff5f5;border:1px solid #ffd0d0;color:#c53030;border-radius:9px}.ok{padding:12px;background:#f1fff9;border:1px solid #bdebd9;color:#087a52;border-radius:9px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form label{font-weight:700;font-size:12px}.form input,.form select,.form textarea{width:100%;box-sizing:border-box;margin-top:5px;padding:9px;border:1px solid #d8e1eb;border-radius:8px}.span{grid-column:span 3}@media(max-width:800px){.grid,.form{grid-template-columns:1fr}.span{grid-column:auto}}</style></head><body><div class="wrap"><div class="top"><div><h1>EzyProcure Approval Control</h1><div>Actual approval → reject/approve → audit workflow</div></div><div><button class="btn" onclick="location.href='./app-final.html?v=3.0.3'">Back to ERP</button> <button class="btn" onclick="loadAll()">Refresh</button></div></div><div id="msg"></div><div class="grid"><div class="panel"><h2>Create approval request</h2><div class="form"><label>Entity<select id="type"><option>PR</option><option>RFQ</option><option>PO</option><option>GRN</option><option>MRN</option><option>INVOICE</option><option>EXPENSE</option><option>TASK</option></select></label><label class="span">Record<select id="record"></select></label><label class="span">Comment<textarea id="comment"></textarea></label></div><p><button class="btn primary" onclick="requestApproval()">Request approval</button></p></div><div class="panel"><h2>Control summary</h2><div id="summary">Loading…</div></div></div><div class="panel"><h2>Approval queue</h2><div id="queue">Loading…</div></div><div class="panel"><h2>Audit trail</h2><div id="audit">Loading…</div></div></div><script>const API='https://ezyprocure-api.onrender.com',token=localStorage.getItem('ezyprocure_token');const $=x=>document.getElementById(x);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'API '+r.status);return d}const maps={PR:'/api/pr',RFQ:'/api/rfq',PO:'/api/po',GRN:'/api/grn',MRN:'/api/mrn',INVOICE:'/api/invoices',EXPENSE:'/api/expenses',TASK:'/api/tasks'};async function records(){const t=$('type').value;try{const d=await api(maps[t]);const arr=Array.isArray(d)?d:[];$('record').innerHTML=arr.map(x=>'<option value="'+x.id+'">'+esc(x.number||x.title||x.name||x.id)+'</option>').join('')||'<option value="">No records</option>'}catch(e){$('record').innerHTML='<option value="">'+esc(e.message)+'</option>'}}$('type').onchange=records;async function requestApproval(){try{await api('/api/approvals',{method:'POST',body:JSON.stringify({entityType:$('type').value,entityId:$('record').value,comment:$('comment').value})});$('msg').innerHTML='<p class="ok">Approval request created.</p>';await loadAll()}catch(e){$('msg').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}async function decide(id,status){let comment='';if(status==='REJECTED'){comment=prompt('Rejection reason (required):')||'';if(!comment.trim())return}try{await api('/api/approvals/'+id,{method:'PATCH',body:JSON.stringify({status,comment})});$('msg').innerHTML='<p class="ok">Approval '+status.toLowerCase()+'.</p>';await loadAll()}catch(e){$('msg').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}async function loadAll(){if(!token){location.href='./login.html';return}try{const [me,s,a]=await Promise.all([api('/api/auth/me'),api('/api/control-center'),api('/api/audit')]);$('summary').innerHTML='<b>'+esc(me.name)+' · '+esc(me.role)+'</b><p>Pending approvals: <b>'+s.pendingApprovals+'</b><br>Users: '+s.users+' · Vendors: '+s.vendors+' · Employees: '+s.employees+'<br>PR: '+s.prs+' · PO: '+s.pos+' · GRN: '+s.grns+' · MRN: '+s.mrns+' · Invoices: '+s.invoices+'<br>Audit entries: '+s.auditCount+'</p>';$('audit').innerHTML='<div class="table"><table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th></tr>'+a.map(x=>'<tr><td>'+new Date(x.createdAt).toLocaleString()+'</td><td>'+esc(x.user?.name)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.entityType)+' '+esc(x.entityId)+'</td></tr>').join('')+'</table></div>';const q=await api('/api/approvals?status=PENDING');$('queue').innerHTML=q.length?'<div class="table"><table><tr><th>Type</th><th>Record</th><th>Requested by</th><th>Comment</th><th>Action</th></tr>'+q.map(x=>'<tr><td>'+esc(x.entityType)+'</td><td>'+esc(x.entityId)+'</td><td>'+esc(x.user?.name)+'</td><td>'+esc(x.comment)+'</td><td><button class="btn primary" onclick="decide(\''+x.id+'\',\'APPROVED\')">Approve</button> <button class="btn danger" onclick="decide(\''+x.id+'\',\'REJECTED\')">Reject</button></td></tr>').join('')+'</table></div>':'<div class="ok">No pending approvals.</div>';await records()}catch(e){$('msg').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}loadAll();</script></body></html>
